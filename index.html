<style>
:root{--bg:#f6f4ef;--surface:#fff;--ink:#1d2330;--muted:#667085;--line:#e3dfd5;--accent:#c8372d;--accent-ink:#fff;--shadow:0 2px 12px rgba(20,25,40,.18);--nav-h:58px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--surface:#1c212c;--ink:#e8eaf0;--muted:#9aa3b5;--line:#2b3140;--accent:#ff6b5e;--accent-ink:#12151c;--shadow:0 2px 12px rgba(0,0,0,.5)}}
:root[data-theme=dark]{--bg:#12151c;--surface:#1c212c;--ink:#e8eaf0;--muted:#9aa3b5;--line:#2b3140;--accent:#ff6b5e;--accent-ink:#12151c;--shadow:0 2px 12px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;font-size:calc(16px * var(--fs,1))}
button{font:inherit;color:inherit;cursor:pointer}
.view{display:none;flex:1;min-height:0;position:relative}
.view.on{display:block}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 24px);max-width:760px;margin:0 auto;height:100%}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:1.25rem;margin:18px 0 8px}
.muted{color:var(--muted)}
nav{display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);flex:none;z-index:30}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.72rem;color:var(--muted)}
nav button span{font-size:1.35rem;line-height:1}
nav button.on{color:var(--accent);font-weight:600}
#map{position:absolute;inset:0}
#v-map{--top:env(safe-area-inset-top)}
.fab{position:absolute;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:1.2rem;z-index:5;margin-top:var(--top)}
.fab.on{background:#1e78ff;color:#fff}
.legend{position:absolute;left:8px;top:calc(8px + var(--top));display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 70px);z-index:5}
.legend button{border:0;border-radius:99px;padding:3px 10px;background:var(--surface);box-shadow:var(--shadow);font-size:.74rem;display:flex;align-items:center;gap:5px}
.legend button.off{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;z-index:8;background:var(--bg);text-align:center;padding:24px}
#loading .bar{width:220px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px auto 0}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.maplibregl-ctrl-attrib{font-size:10px}
#sheet{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.25);z-index:20;max-height:54dvh;display:none;flex-direction:column}
#sheet.on{display:flex}
#sheet .grab{width:100%;padding:8px 0 4px;border:0;background:none;flex:none}
#sheet .grab i{display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
#sheetBody{overflow-y:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;border-radius:99px;padding:2px 10px;background:var(--bg);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn[disabled]{opacity:.4}
.sheet-text p{margin:.6em 0}
.shop-note{border-left:3px solid var(--accent);padding-left:10px;margin-top:14px}
.warn{font-size:.82rem;background:rgba(255,170,0,.14);border:1px solid rgba(255,170,0,.5);border-radius:10px;padding:6px 10px;margin:8px 0}
#tour{position:absolute;left:8px;right:62px;top:calc(84px + var(--top));z-index:6;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:none}
#tour.on{display:block}
#tour .t{font-weight:600}
.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.85rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 4px;font-weight:700;font-size:1.05rem;cursor:pointer;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.group>summary::-webkit-details-marker{display:none}
.group>summary .n{margin-left:auto;font-weight:400;color:var(--muted);font-size:.85rem}
.item{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item .nm{font-weight:600}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;border-left:4px solid;display:block}
.photo{margin:4px 0 8px}
.photo img{width:100%;max-height:30dvh;object-fit:cover;border-radius:12px;display:block;background:var(--line)}
.photo figcaption{font-size:.7rem;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo figcaption a{color:inherit}
.item .sub{font-size:.82rem;color:var(--muted)}
.item .st{margin-left:auto;display:flex;gap:6px;font-size:1.05rem}
.item.seen .nm{opacity:.55;text-decoration:line-through}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.stop{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.stop .num{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
details.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 14px}
details.fact summary{padding:12px 0;font-weight:600;cursor:pointer}
details.fact p{margin:.3em 0 .8em}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem;z-index:100;display:none;max-width:90%;text-align:center}
.set{display:flex;align-items:center;gap:10px;margin:8px 0}
input[type=range]{flex:1}
a{color:var(--accent)}
#nojs{position:fixed;inset:0;z-index:999;background:var(--bg);padding:32px 20px;overflow:auto}
</style>
</head>

"use strict";
const G = {"pois":[{"id":0,"name":"St Pancras","district":"Camden","cats":["see"],"page":4,"lat":51.531895,"lon":-0.126676,"url":null,"text":["Vele reizigers die het prachtige Londen willen ontdekken komen aan in St Pancras International Station. Dit station is een van de meest iconische spoortwegstations van Londen en het is ook een belangrijk internationaal knooppunt. Het station valt op omwille van de imposante grootte en de indrukwekkende architectuur.","Vlak naast het St Pancras Station ligt het King’s Cross Station waar verschillende intercitytreinen vertrekken. Het King’s Cross is ook bekend van de boekenreeks Harry Potter, geschreven door J.K.Rowling. Vanop dit station vertrekt de Zweinsteinexpres. Je kan hier dan ook een bezoekje brengen aan de Harry Potter Shop in de stationshal waarnaast een bagagekarretje staat dat in de muur rijdt met het bord ‘Perron 9 ¾’. Een bekende plaats voor een fotomoment."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/0.jpg","credit":"Colin · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:St_Pancras_Railway_Station_2012-06-23.jpg"}},{"id":1,"name":"Camden Market","district":"Camden","cats":["see","shop"],"page":5,"lat":51.541605,"lon":-0.146543,"url":"https://camdenmarket.com","text":["Camden Market is een marktplaats in het Noorden van Londen. Het is een populaire trekpleister waar je tal van leuke shops kan vinden. Het bestaat eigenlijk uit zes verschillende markten in dezelfde regio.","De markten zijn de Camden Lock-markt, de Stallenmarkt, de Hawley Wharf, de Buck Street- markt, de Camden Lock Village en de Iverness Street-markt. De markten bieden een gevarieerd aanbod van producten en eetmogelijkheden. Zo vind je er kledij, juwelen, boeken, antiek, accessoires, tassen, groenten, fruit en ambachtelijke producten."],"shop":["Als je in Londen bent, dan hoort shoppen erbij. De Londense ervaring is niet compleet zonder een shoppingdag. Gelukkig heeft Londen veel opties om te winkelen, voor alle budgetten. We bespreken daarom graag de beste plaatsen om te winkelen in het prachtige Londen.","Zoals eerder vermeld is Camden Market een marktplaats in het Noorden van Londen. Er zijn zes verschillende markten vlak bij elkaar, waardoor er voor ieder wat wils iets te vinden is. De markten zijn de Camden Lock-markt, de Stallenmarkt, de Hawley Wharf, de Buck Street-markt, de Camden Lock Village en de Iverness Street-markt. De markten bieden een gevarieerd aanbod van producten en eetmogelijkheden. Zo vind je er kledij, juwelen, boeken, antiek, accessoires, tassen, groenten, fruit en ambachtelijke producten."],"links":[{"label":"Boek een culinaire rondleiding doorheen Camden Town.","url":"https://www.getyourguide.nl/londen-l57/londen-camden-market-rondleiding-met-gids-door-culinaire-tour-t504469/?partner_id=W38F18N&cmp=citygids_london"}],"top":true,"photo":{"src":"photos/1.jpg","credit":"en:User:Grim23 · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Camden_markets_entrance.JPG"}},{"id":2,"name":"Regent’s Park","district":"Camden","cats":["see"],"page":6,"lat":51.533846,"lon":-0.155988,"url":null,"text":["Een prachtig park in deze regio is Regent’s Park. Het is een van de acht Koniklijke Parken van Londen en heeft een grootte van 2 vierkante kilometer. Er zijn verschillende mogelijkheden om te genieten van het prachtige groen. Zo kan je er picknicken, zonnen, wandelen, fietsen en nog vele andere activiteiten uitvoeren. Er zijn verschillende speeltuinen en er is zelfs een zoo"],"shop":[],"links":[],"top":false,"photo":{"src":"photos/2.jpg","credit":"ed g2s • talk · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Regent%27s_Park_bandstand.jpg"}},{"id":3,"name":"London Zoo","district":"Camden","cats":["see"],"page":6,"lat":51.535795,"lon":-0.153477,"url":null,"text":["De oudste wetenschappelijke dierentuin ter wereld ligt in Londen. Het ligt op de grens tussen de districten Camden en Westminster. De London Zoo werd geopend in 1828 en werd gebouwd om wetenschappelijke studies uit te voeren. Rond 1831 werden de dieren uit de Tower of London overgebracht naar de dierentuin en in 1847 werd de dierentuin geopend voor het publiek.","Er zijn zo’n 670 verschillende diersoorten te vinden in de dierentuin en bijna 20.000 dieren in totaal. De dierentuin bevat verder nog shops, restaurants en speeltuinen. Een leuke plaats voor een familieuitstap."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/3.jpg","credit":"gillfoto · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:London_Zoo_40394.jpg"}},{"id":4,"name":"Russell Square","district":"Camden","cats":["see"],"page":6,"lat":51.5219,"lon":-0.126,"url":null,"text":["In 1804 werd Russell Square aangelegd op de plaats waar het Bedford House stond. Het plein werd in 2002 gerenoveerd tot een cjarmant plein in het hart van Bloomsbury, een wijk in Camden. Deze regio bevat ook de Universiteit van Londen en het British Museum, waardoor de regio een literaire en academische geschiedenis heeft.","Het park biedt een plaats van rust en natuur in deze drukke regio. Er zijn omen, gazons en ook een centrale fontein. Perfect om even aan de drukte te ontsnappen."],"shop":[],"links":[],"top":false,"fixed":true,"photo":{"src":"photos/4.jpg","credit":"Secretlondon · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:RussellSquare.jpg"}},{"id":5,"name":"British Museum","district":"Camden","cats":["see"],"page":7,"lat":51.51961,"lon":-0.126919,"url":"https://www.britishmuseum.org/","text":["Een van de grootste en meest gerenommeerde musea ter wereld is het British Museum in Londen. Het museum ligt vlakbij Russel Square en bevat een indrukwekkende collectie kunst en artefacten uit alle hoeken uit de wereld.","Het gebouw is aan de binnenkant zeer imposant met een ondervdeling per tijdperk, werelddeel en thema. Er zijn zowel vaste tentoonstellingen als tijdelijke en er zijn ook verschillende workshops, lezingen en activiteiten beschikbaar in het museum. Er zijn mogelijkheden voor een hapje en een drankje in de centrale zaal en er zijn ook verschillende museumwinkels. Er zijn gratis plattegrondjes te verkrijgen in het museum. Het is aan te raden een plattegrond te gebruiken tijdens je bezoek, aangezien het museum zo groot is.","Het British Museum ontvangt jaarlijks ruim 6 miljoen bezoekers. Het museum is gratis toegankelijk, al zijn er mogelijkheden om donaties te doen."],"shop":[],"links":[{"label":"Ga op ontdekking in het British Museum met deze begeleide rondleiding.","url":"https://www.getyourguide.nl/londen-l57/londen-rondleiding-british-museum-t687048/?partner_id=W38F18N&cmp=citygids_london"}],"top":true,"photo":{"src":"photos/5.jpg","credit":"Ham · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:British_Museum_from_NE_2.JPG"}},{"id":6,"name":"Charles Dickens Museum","district":"Camden","cats":["see"],"page":8,"lat":51.523987,"lon":-0.116542,"url":null,"text":["Voor literatuurfans is het Charles Dickens Museum een leuke bezienswaardigheid. Het museum kan je vinden aan Doughty Street 48 en dit was ook effectief het voormalige huis van de auteur. In 1925 opende het museum zijn deuren.","Het museum bevat verschillende kamers dat je kan bezichtigen, zoals de studeerkamers en verschillende slaapkamers. De stijl werd terug aangepast aan hoe het in de tijd, wanneer Charles Dickens er woonde, zou zijn ingericht. Je kan er ook enkele handgeschreven manuscripten terugvinden, net als enkele schilderijen waaronder een van jonge Dickens.","De totale collectie breidde uit naar zo’n 100.000 stukken over het leven en werk van Charles Dickens."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/6.jpg","credit":"Dickens Museum · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Charles_Dickens_Museum_London.jpg"}},{"id":7,"name":"Temple Bar Memorial","district":"City of London","cats":["see"],"page":10,"lat":51.514264,"lon":-0.112341,"url":null,"text":["In de middeleeuwen was Londen enkel toegankelijk via verschillende poorten, ‘Bars’ genaamd, om de binnenstad te beschermen. De stadsmuren werden onderbroken door verschillende poorten. De poort ten westen van de City of London was het de Temple Bar. De poort lag tussen de twee belangrijkste residenties van die tijd, the Tower of London en het oude Palace of Westminster.","In 1878 werd de poort verwijderd en werd het Temple Bar Memorial gebouwd om de belangrijkste locatie te markeren. Het memorial bevat een drakensymbool en heeft standbeelden van Koningin Victoria en Edward VII. De oorspronkelijk boog werd bewaard en later terug opgericht in de City of London vlakbij St. Paul’s Cathedral."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/7.jpg","credit":"tony_duell · CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Temple_Bar,_26_August_2012.jpg"}},{"id":8,"name":"Temple Church","district":"City of London","cats":["see"],"page":11,"lat":51.513757,"lon":-0.110532,"url":null,"text":["In dezelfde regio als het Temple Bar Memorial vind je ook de Temple Church. Dit is een van de oudste kerken van Londen en werd gebouwd in de 12e eeuw door de Knights Templar. Het werd gebruikt als het hoofdkwartier van de Tempeliers tijdens de kruistochten.","De kerk valt vooral op omdat het een ronde vorm heeft. De kerk werd tijdens de Tweede Wereldoorlog zwaar beschadigd door Duitse bombardementen, maar werd gerestaureerd en herbouwd. De oorspronkelijke ronde vorm werd behouden, maar een rechthoekig gebouw werd eraan toegevoegd enkele jaren later.","Vandaag de dag houdt de kerk nog regelmatig diensten en er kunnen ook huwelijken gehouden worden, dit enkel voor inwoners van de Inner Temple en Middle Temple. De kerk kwam ook in beeld in de film ‘The Da Vinci Code’."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/8.jpg","credit":"John Salmon · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Temple_Church,_Temple,_London_EC4_(2).jpeg"}},{"id":9,"name":"Inns of Court","district":"City of London","cats":["see"],"page":12,"lat":51.518128,"lon":-0.113982,"url":"http://www.lincolnsinn.org.uk","text":["De City of London is ook het thuis van de Inns of Court. Dit zijn vier juridische instellingen waar advocaten worden opgeleid. Hier zijn juridische verenigingen voor barristers (advocaten hogere rechtbank) en hier worden ook juridische opleidingen gegeven. Verder vind je er kantoren, bibliotheken, kerken en zelfs woningen voor juristen.","De vier instellingen bevinden zich allevier op een andere plaats, maar wel in dezelfde regio. Zo liggen de Inner Temple en Middle Temple ten zuiden van de Temple Church. Terwijl Gray’s Inn en Lincoln’s Inn ten noorden van de Temple Church te vinden zijn.","Als je graag een advocaat in Engeland of Wales wil zijn, moet je behoren tot één van deze vier verenigingen om recht te mogen beoefenen."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/9.jpg","credit":"The wub · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Lincoln%27s_Inn_Gatehouse_-_2017-04-18.jpg"}},{"id":10,"name":"London Museum","district":"City of London","cats":["see"],"page":12,"lat":51.518783,"lon":-0.101645,"url":"https://www.londonmuseum.org.uk","text":["Het London Museum stond voorheen bekend als het ‘Museum of London’ en opende zijn deuren in 1976. In 2024 veranderde de naam naar London Museum en sloot het ook tijdelijk de deuren voor een verhuis. Het museum zal de deuren terug openen in 2026 in Smithfield in City of London.","Het museum bevat miljoenen objecten, deze tonen de geschiedenis van de stad. Dit in de vorm van objecten, verhalen en kunst. De archeologische collectie is zo groot dat deze in het Guinnes Book of Records vermeld staat.","Het museum organiseert verschillende evenementen en workshops en het museum zelf is gratis toegankelijk.","Er is ook een afdeling London Museum Docklands. Deze toont de 400-jarige geschiedenis van de Docklands in London. Dit museum is ook gratis toegankelijk, maar ligt niet in het centrum van London."],"shop":[],"links":[{"label":"Verken de City of London met een wandeltour en ontdek de historische pubs.","url":"https://www.getyourguide.nl/londen-l57/drink-londen-historische-wandeltour-door-pubs-t27204/?partner_id=W38F18N&cmp=citygids_london"}],"top":false},{"id":11,"name":"Old Bailey","district":"City of London","cats":["see"],"page":13,"lat":51.515495,"lon":-0.102036,"url":null,"text":["De Central Criminal Court of England and Wales, ook gekend als Old Bailey, bevindt zich ook in de City of London. Dit is het bekendste strafgerechtshof van het Verenigd Koninkrijk en staat daarom ook symbool voor het Engelse Rechtssysteem.","Het gebouw werd voltooid in 1902 en wordt gezien als een monumentaal pand. Het is een van de vele verschillende gerechtsgebouwen van de Crown Court of England and Wales. Hier worden strafzaken van Groot-London behandeld en in uitzonderlijke gevallen worden strafzaken uit andere delen van Engeland en Wales hier ook behandeld. Deze gebouwen en rechtszalen zijn openbaar, al zijn er stricte beveiligingsmaatregelen. Hou rekening met deze maatregelen tijdens je bezoek.","Bovenop het gebouw staat een standbeeld van Vrouwe Justitia, dit is een bronzen beeld gemaakt door F.W. Pomeroy. Ze houdt een zwaard en de weegschaal van gerechtigheid vast.","Het gebouw komt ook voor in verschillende fictiewerken, waaronder de films ‘V for Vendetta’ en de ‘Justice League’, en worden ook vermeld in literaire werken, zoals ‘Witness for the Prosecution’ van Agatha Christie."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/11.jpg","credit":"Nevilley at en.wikipedia · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Oldbaileylondon-900.jpg"}},{"id":12,"name":"St. Paul’s Cathedral","district":"City of London","cats":["see"],"page":14,"lat":51.513978,"lon":-0.098346,"url":"https://www.stpauls.co.uk","text":["De moederkerk van London staat ook in de City of London. Deze kerk, St. Paul’s Cathedral, is een van de meest indrukwekkende gebouwen in London. De volledige naam van de kerk luidt Cathedral Church of St. Paul the Apostle. De kerk dient als de zetel van de Bisschop van London en ze staat symbool voor veerkracht, geloof en nationale trots.","De bouw begon in 1675 en het volledige structuur zoals we deze vandaag kennen werd afgewerkt in 1710. De kerk werd gebouwd door een heropbouwprogramma na de Grote Brand van London. Tot 1963 was de kerk het hoogste gebouw van Londen. En het is de tweede grootste kerk van het Verenigd Koninkrijk.","De kerk overleefde de bombardementen tijdens de Tweede Wereldoorlog en de Tweede Grote Brand van Londen. Toch heeft de kerk wat beschadigingen opgelopen tijdens deze gebeurtenissen en waren verbouwingen en restauraties dus wel nodig door de jaren heen.","Tal van gebeurtenissen en evenementen vonden plaats in deze kerk, waaronder het Huwelijk van Prins Charles en Lady Diana Spencer. Ook de begrafenis van Winston Churchill vond plaats in deze kerk.","De ker is open voor bezoekers buiten op zondag, wegens de kerkdiensten. Er zijn rondleidingen beschikbaar en een volledig programma kan je vinden op de website. De kerkdiensten kan je gratis bijwonen, maar om het gebouw te verkennen heb je een toegangsticket nodig."],"shop":[],"links":[{"label":"Koop hier je toegangsticket voor St Paul’s Cathedral.","url":"https://www.getyourguide.nl/londen-l57/sla-de-rij-over-st-paul-s-cathedral-met-korting-t19600/?partner_id=W38F18N&cmp=citygids_london"}],"top":true,"photo":{"src":"photos/12.jpg","credit":"Mark Fosh · CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:St_Pauls_aerial_(cropped).jpg"}},{"id":13,"name":"London Stock Exchange","district":"City of London","cats":["see"],"page":15,"lat":51.515175,"lon":-0.099044,"url":null,"text":["In 1571 opende de London Stock Exchange zijn deuren met behulp van Koningin Elizabeth I, al werd het toen de Royal Exchange genoemd. De beurs werd gebouwd naar hetzelfde model van de Beurs van Antwerpen. In de 17e eeuw waren de effectenmakelaars zo onbeschoft, dat hen de toegang tot de Royal Exchange werd geweigerd. Zij moest dus in de buurt vestigingen zoeken waar ze konden werken.","De Grote Brand van London vernietigde het oorspronkelijke gebouw, dus in 1669 werd het herbouwd en gingen de deuren opnieuw open. Over de jaren heen kreeg het gebouw nog verschillende renovaties, toevoegingen en verbouwingen. Hier kon je makelaars, kooplieden en handelaren vinden. De effectenmarkt was geboren en om ervoor te zorgen dat je alleen kon handelen met een vergunning, werd er in 1697 een wet opgelegd door het parlement. Je kon dus een zware boete krijgen indien je handelde zonder vergunning.","In 2004 kreeg de London Stock Exchange een nieuwe locatie, niet meer naast de Bank of England, maar wel vlakbij St.Paul’s Cathedral. Het is een van de oudste en grootste andelenbeurzen in de wereld. De beurs is niet toegankelijk voor het publiek."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/13.jpg","credit":"Ben1we · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:London_Stock_Exchange_Coat_of_Arms.svg"}},{"id":14,"name":"Barbican Centre","district":"City of London","cats":["see"],"page":16,"lat":51.520425,"lon":-0.093901,"url":"https://www.barbican.org.uk","text":["Wil je graag wat meer creativiteit? Bezoek dan het grootste culturele centrum van Europa. Het Barbican Centre ligt vlakbij de London Stock Exchange en is toch een totaal andere wereld. Het werd geopend in 1982.","Dit is het centrum voor podiumkunsten en herbergt heel wat pracht en praal. Zo kan je er klassieke en hedendaagse muziekconcerten vinden, net als theatervoorstellingen, filmvertoningen en ook kunsttentoonstellingen. Er is ook een bibliotheek, drie cinemazalen, verschillende restaurants en zelfs een serre aanwezig in het gebouw. Het is dus een plaats voor dans, muziek, film, kunst en theater. Verschillende gezelschappen maken deel uit van deze vestiging, zo vind je er de London Symphony Orchestra, BBC Symphony Orchestra en ook de Royal Shakespeare Company."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/14.jpg","credit":"Daniel Case · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Barbican_Lakeside_on_a_summer_evening.jpg"}},{"id":15,"name":"Guildhall","district":"City of London","cats":["see"],"page":16,"lat":51.516539,"lon":-0.091103,"url":"https://www.thecityofldn.com/directory/guildhall-great-hall/","text":["Tussen 1411 en 1440 werd het Guildhall gebouwd In Moortgate, een regio in de City of London. Het gebouw onderging enige schade tijdens de Grote Brand van London. De restauratie werd helaas tenietgedaan tijdens de Tweede Grote Brand van London.","Het gebouw heeft vele functies gehad over de jaren heen, zo werd het gebruikt voor banketten, koninklijke rechtzaken en staatsceremonies. Al zeker 800 jaar wordt het gebouw gebruikt als het ceremoniële en bestuurlijke centrum van de stad. De City of London Corporation – het oudste gemeentebestuur van het Verenigd Koninkrijk – vergadert nog steeds in dit gebouw, en koningen, kooplieden en gilden komen hier al samen sinds de middeleeuwen.","Er zijn verschillende standbeelden terug te vinden zoals van Winston Churchill, Admiral Nelson en William Shakespeare. De kelder bevat overblijfselen van het ondergrondse Romeinse amfitheater dat ontdekt werd in 1980. En je kan er ook kunstwerken vinden van vroeger en nu. Je kan het gebouw bezoeken en er zijn ook rondleidingen beschikbaar."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/15.jpg","credit":"Diliff · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Guildhall,_City_of_London_-_Diliff.jpg"}},{"id":16,"name":"Bank of England","district":"City of London","cats":["see"],"page":17,"lat":51.513967,"lon":-0.088356,"url":"http://www.bankofengland.co.uk/","text":["De Bank of England is de centrale bank van het Verenigd Koninkrijk en wordt ook wel eens ‘the Old Lady of Threadneedle Street’ genoemd. De bank werd opgericht in","1694 en diende als bankier en schuldbeheerder van de Britse regering. Het doel van de bank was op geld te lenen aan de regering tijdens de oorlog tegen Frankrijk.","Het is de op één na oudste centrale bank van de wereld. Sinds 1734 bevindt kan je de bank vinden in Threadneedle Street, waar je ook de bijnaam van kan afleiden. De officiële goudreserves van het Verenigd Koninkrijk, en zo’n dertig andere landen, worden hier bewaard.","Er is een museum aan verbonden waarin de geschiedenis van het gebouw wordt verteld van bij de start in 1694 tot vandaag. Dit museum is gratis toegankelijk."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/16.jpg","credit":"acediscovery · CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:Bank-of-England.jpg"}},{"id":17,"name":"Royal Exchange","district":"City of London","cats":["see","shop"],"page":17,"lat":51.513837,"lon":-0.087451,"url":"https://www.theroyalexchange.co.uk/","text":["Tegenover de Bank of England ligt de handelsbeurs Royal Exchange, die wat aan een Griekse tempel doet denken. Vroeger was dit de plaats waar effectenhandelaars hun zaken deden, dit wordt nu gedaan in het gebouw van de London Stock Exchange.","De Royal Exchange is nu een shoppingcenter waar je luxewinkels kan terugvinden. Nu kan je er terecht voor een luxueuze shoppingtour met bekende merken als Gucci, Jo Malone London, Paul Smith, Tiffany & Co en nog vele andere luxemerken. De binnenplaats is perfect voor een drankje of een hapje."],"shop":["De City of London bevat ook mogelijkheden om te shoppen. Tegenover de Bank of England ligt de handelsbeurs Royal Exchange, die wat aan een Griekse tempel doet denken. De Royal Exchange is een shoppingcenter waar je luxewinkels kan terugvinden. Je kan er terecht voor een luxueuze shoppingtour met bekende merken als Gucci, Jo Malone London, Paul Smith, Tiffany & Co en nog vele andere luxemerken. De binnenplaats is perfect voor een drankje of een hapje."],"links":[],"top":false,"photo":{"src":"photos/17.jpg","credit":"Diego Delso · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Bolsa,_Londres,_Inglaterra,_2014-08-11,_DD_144.JPG"}},{"id":18,"name":"Mansion House","district":"City of London","cats":["see"],"page":18,"lat":51.51316,"lon":-0.08949,"url":"https://www.cityoflondon.gov.uk/about-us/about-the-city-of-london-corporation/mansion-house","text":["Vlakbij de Bank of London en de Royal Exchange vind je Mansion House. Het werd gebouwd in de 18e eeuw en is de officiële residentie van de Lord Mayor van London. Het gebouw wordt ook gebruikt voor formele bijeenkomsten, waaronder twee jaarlijkse feesten. Begin juni vindt er de Mansion House Speech plaats, de speech over de toestand van de Britse economie, gegeven door minister van Financiën.","Er worden ook officiële gasten ontvangen, zoals staatshoofden en ambassadeurs. Je vindt er ook de Mansion House Art Collection, vele kunststukken werde geschonken door voormalige Lord Mayors.","Een bezoek is mogelijk en gratis, al is reserveren vereist. Het is niet dagelijks geopend, maar biedt wel rondleidingen met gids."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/18.jpg","credit":"Michael Gwyther-Jones from London, UK · CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Mansion_House,_City_of_London_(40478193673).jpg"}},{"id":19,"name":"The Gherkin","district":"City of London","cats":["see"],"page":19,"lat":51.514638,"lon":-0.08037,"url":null,"text":["London heeft natuurlijk veel gebouwen, waaronder enkele indrukwekkende wolkenkrabbers. Een van de meest imposante wolkenkrabbers is The Gherkin. Het kreeg deze bijnaam aangezien het hebouw veel weg heeft van een augurk.","Het gebouw telt 41 verdiepingen en is zo’n 180 meter hoog. Het werd gebouwd in 2003 en opende de deuren in 2004. Er bevinden zich verschillende kantoren in het gebouw waar verschillende firma’s .","Tijdens de bouw werd er een skelet gevonden van een tienermeisje. De overblijfselen waren zo’n 1600 jaar oud. Deze werden tijdelijk ondergebracht in het Museum of London (‘London Museum’ vanaf 2026). Nadar het gebouw voltooid werd, werd het lichaam in 2006 terug begraven in aan het gebouw en werd het graf gemarkeerd met een inscriptie."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/19.jpg","credit":"Paste at English Wikipedia · Public domain","page":"https://commons.wikimedia.org/wiki/File:30_St_Mary_Axe,_%27Gherkin%27.JPG"}},{"id":20,"name":"The Monument","district":"City of London","cats":["see"],"page":20,"lat":51.510515,"lon":-0.085814,"url":null,"text":["In het hart van de City of London vind je een prachtige eerbetoon terug aan de Grote Brand van London. The Monument of the Great Fire of London, kortweg The Monument genoemd, is een indrukwekkende zuil dat ontwerpen werd door Christopher Wren.","Het monument werd gebouwd ter nagedachtenis aan de Grote Brand van London in 1666. Tegelijkertijd is het een symbool voor de heropbouw na de brand. Het heeft een hoogte van 61,57 meter, dit is de afstand van het monument tot het punt waar de brand startte. De brand duurde zo’n vier dagen in totaal en verwoestte vier vijfde van de stad.","Je kan het monument beklimmen met de wenteltrap binnenin. Het zijn zo’n 311 treden in totaal en je kan bovenaan op het uitkijkplatform genieten van het panoramisch uitzicht over Londen. Indien je meer informatie wilt over de brand, kan je dit vinden aan de voet van het monument."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/20.jpg","credit":"Eluveitie · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:The_Monument_to_the_Great_Fire_of_London.JPG"}},{"id":21,"name":"St. Dunstan in the East","district":"City of London","cats":["see"],"page":20,"lat":51.509734,"lon":-0.082445,"url":null,"text":["De ruïnes dat je hier gaat vinden zijn de enige overblijfselen van de St. Dunstan in the East Church. Het is een unieke en bijzondere plaats dat nu ook een kleine stadstuin is dat simpelweg St. Dunstan in the East noemt. De oorspronkelijke kerk was beschadigd na de Grote Brand in 1666, de heropbouw was te duur, dus werden er enkele opknapwerkjes uitgevoerd in de plaats. Toen het dak in slechte staat was in 1817 werd besloten de kerk te herbouwen.","De kerk werd helaas opnieuw beschadigd tijdens de Tweede Wereldoorlog in 1941. Aangezien enkel twee muren deze bombardementen overleefden, werd in 1967 besloten om er een stadstuin van te maken."],"shop":[],"links":[{"label":"Ontdek de City of London met deze begeleide stadstour.","url":"https://www.getyourguide.nl/londen-l57/verborgen-juweeltjes-tour-door-de-stad-londen-t622249/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"photo":{"src":"photos/21.jpg","credit":"Elisa.rolle · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:St_Dunstan-in-the-East.jpg"}},{"id":22,"name":"Whitechapel","district":"Tower Hamlets","cats":["see"],"page":22,"lat":51.514894,"lon":-0.064285,"url":null,"text":["Als je graag een beruchte regio in Londen wil bezoeken, dan is Whitechapel een geweldige keuze. Dit is een levendige wijk met een speciale geschiedenis, dit is namelijk de regio waar Jack The Ripper actief was, deze seriemoordenaar werd nooit gevonden.","De regio kan je verkennen met een gids, deze zal tijdens de rondleiding verschillende plaatsen tonen waar slachtoffers van de seriemoordenaar gevonden werden. Deze rondleiding vinden ’s avonds plaats, waardoor het een iets griezeligere sfeer krijgt. Vandaag de dag is het een gewone wijk met woningen, shops en verschillende plaatsen om uit te gaan."],"shop":[],"links":[{"label":"Ervaar Whitechapel met deze Jack the Ripper Wandeltour.","url":"https://www.getyourguide.nl/londen-l57/londen-jack-the-ripper-interactieve-rondleiding-met-gids-t359535/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"photo":{"src":"photos/22.jpg","credit":"TheFrog001 · CC0","page":"https://commons.wikimedia.org/wiki/File:Whitechapel_LU_roundel_totem_pole.jpg"}},{"id":23,"name":"Tower of London","district":"Tower Hamlets","cats":["see"],"page":23,"lat":51.508343,"lon":-0.075923,"url":"https://www.hrp.org.uk/tower-of-london/#gs.m5yh0j","text":["Een van de meest historische gebouwen in Londen kan je terugvinden in Tower Hamlets. Dit indrukwekkende gebouw bestaat uit verschillende gebouwen en muren waarvan het eerste gebouwd werd in 1078. Willem de Veroveraar bouwde dit eerste gebouw, de Witte Toren, en was oorspronkelijk een teken van onderdrukking. Deze toren gaf het gebouw ook zijn naam, de Tower of London.","In de 12e en 13e eeuw werd het gebouw uitgebreid met meerdere gebouwen en vestigingsmuren. De indeling dat deze vestiging kreeg in de 13e eeuw is dan ook behouden gebleven, maar werd gewoon verder uitgebreid. De Tower heeft veel verschillende functies gehad over de jaren heen, zo was het een paleis, gevangenis, wapenkamer, schatkamer, menagerie, openbaar archief, thuisbasis van de Koninklijke Munt en als bewaarplaats van de kroonjuwelen van Engeland.","Er vonden ook vele verschillende gebeurtenissen plaats, zoals de verdwijning van de prinsen in de Tower, gevangenschap van Elizabeth I voor ze gekroond werd tot koningin en ook veel verschillende executies vonden hier plaats.","De dag van vandaag is het een populaire toeristische attractie waar je veel kan leren over de geschiedenis van het gebouw. De kroonjuwelen zijn ook aanwezig in de vestiging, dit onder strenge bewaking. Je kan deze bezichtigen, net als voorbeelden van de voorgaande kroonjuwelen. Elke koning of koningin krijgt namelijk de kans om de kroonjuwelen in stijl aan de passen indien gewenst. Je komt meer te weten over de voormalige bewoners, gevangenen, militaire verleden en zelfs de dieren die hier gehouden werden.","De toegang is niet gratis en je kan zowel online als ter plekke een ticket kopen. Er zijn verschillende souvenirshops aanwezig en er is ook een cafetaria en terrasjes. Tijdens de zomer is er een ijskar aanwezig op het centrale plein. Er lopen acteurs rond in gepaste kledij, waardoor je echt een idee krijgt hoe het was hier te lopen toen deze vestiging gebouwd werd. Er zijn rondleidingen mogelijk, dit onder leiding van een Beefeater. Beefeater is een bijnaam voor de Yeomen Warders, de ceremoniële bewakers van de Tower of London."],"shop":[],"links":[{"label":"Boek hier een toegangsticket tot de Tower of London en leer meer over de","url":"https://www.getyourguide.nl/tower-of-london-l2708/londen-tower-of-london-and-crown-jewels-exhibition-ticket-t21253/?partner_id=W38F18N&cmp=citygids_london"}],"top":true,"photo":{"src":"photos/23.jpg","credit":"[Duncan] from Nottingham, UK · CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Tower_of_London_from_the_Shard_(8515883950).jpg"}},{"id":24,"name":"Tower Bridge","district":"Tower Hamlets","cats":["see"],"page":24,"lat":51.505691,"lon":-0.075226,"url":"https://www.towerbridge.org.uk","text":["Vlakbij de Tower of London ligt de Tower Bridge. Dit is een van de meest iconische bruggen ter wereld en is een prachtig Victoriaans meesterwerk. Deze brug verbindt Tower Hamlets met Southwark over de rivier the Thames.","De brug werd gebouwd tussen 1886 en 1894 en werd ontworpen doot John Wolfe Barry en Henry Marc Brunel. Het is één van de vijf Londense Bruggen. De brug heeft een lengte van 290 meter en heeft twee torens die elk 65 meter hoog zijn. Deze torens zijn bovenaan met elkaar verbonden door middel van twee loopbruggen. De Tower Bridge is een basculebrug, wat betekent dat de brug openkan om scheepvaart mogelijk te maken.","De brug is toegankelijk voor voetgangers en voertuigen. Het is dan ook een iconisch kenmerk van Londen. Binnenin kan je er de Tower Bridge Exhibition vinden. Deze tentoonstelling toont de geschiedenis van de bezienswaardigheid vanaf de bouw. De werking van de brug wordt alsook uitgelegd en je krijgt de kans om de bovenste loopbruggen te ontdekken."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/24.jpg","credit":"Fuzzypiggy · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Tower_Bridge_at_Dawn.jpg"}},{"id":25,"name":"Old City Hall","district":"Southwark","cats":["see"],"page":27,"lat":51.504894,"lon":-0.078657,"url":null,"text":["Ook in Southwark kan je verschillende unieke gebouwen terugvinden. Een van de eerste indrukwekkende gebouwen dat je tegenkomt, is de Old City Hall van London. Dit imposante gebouw ligt aan de rivier Thames, vlakbij de Tower Bridge.","Tot 2021 werd dit gebouw gebruikt als het stadshuis van London, dat nu gelokaliseerd is in The Crystal aan de andere kant van Londen. Het gebouw zal omgevormd worden tot een gebouw voor gemengd gebruik met zowel kantoren als winkelpanden. In 2024 werden deze plannen goedgekeurd."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/25.jpg","credit":"Garry Knight · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:London_City_Hall.jpg"}},{"id":26,"name":"HMS Belfast","district":"Southwark","cats":["see"],"page":27,"lat":51.506634,"lon":-0.081385,"url":"https://www.iwm.org.uk/visits/hms-belfast","text":["Geschiedenisliefhebbers worden aangeraden om even langs te gaan bij het oorlogsschip HMS Belfast. Dit schip ligt verankerd op de Thames, vlakbij de Tower Bridge en de Tower of London. Het schip werd gebouw in de jaren ’30 en was een van de tien lichte kruisers die toen in opdracht van de Royal Navy werden gebouwd.","Het schip heeft ook een interessant verleden, aangezien het gebruikt werd tijdens de Tweede Wereldoorlog. Het schip was een van de schepen dat heeft deelgenomen aan D-Day. Verder werd het schip ook gebruikt in het poolgebied tijdens de jacht o de Scharnhorst en werd het schip ook gebruikt tijdens de Koreaanse oorlog.","Vandaag de dag wordt het schip niet meer actief gebruikt als oorlogsschip. Je kan er terecht om meer te leren over de geschiedenis, aangezien het omgevormd werd tot museumschip en onderdeel uitmaakt van het Imperial War Museum, dat in Lambeth ligt."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/26.jpg","credit":"Alvesgaspar · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:London_November_2013-14a.jpg"}},{"id":27,"name":"The Shard","district":"Southwark","cats":["see"],"page":28,"lat":51.504517,"lon":-0.086494,"url":"http://www.the-shard.com/","text":["The Shard is ook een indrukwekkend gebouw. Het is ook gekend als de Shard London Bridge en had ooit de bijnaam London Bridge Tower. Het gebouw heeft een piramideachtige vorm en bestaat uit 72 verdiepingen. Het is volledig met glas omkleed, waardoor ‘The Shard’ een perfecte naam is.","Het gebouw is zo’n 309,6 meter hoog waardoor het het hoogste gebouw van het Verenigd Koninkrijk is. Op het 72e verdiep is er een obersvatieplatform dat uitkijkt over heel London, dit op een hoogte van 244 meter.","Om naar het observatiedek te gaan, heb je een toegangsticket nodig. Tickets kan je online boeken. Verder zijn er ook nog bars en restaurants aanwezig in het gebouw. Voor degenen die graag in absolute luxe willen verblijven, is er in het gebouw ook een hotel aanwezig."],"shop":[],"links":[{"label":"Geniet van een uitzicht over London door een bezoek aan The Shard.","url":"https://www.getyourguide.nl/londen-l57/het-uitzicht-vanaf-the-shard-experience-t24625/?partner_id=W38F18N&cmp=citygids_london"}],"top":true,"photo":{"src":"photos/27.jpg","credit":"Colin · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:The_Shard_at_sunset_2017_(cropped).jpg"}},{"id":28,"name":"Old Operating Theatre Museum","district":"Southwark","cats":["see"],"page":29,"lat":51.505151,"lon":-0.088646,"url":"https://oldoperatingtheatre.com/","text":["Indien je graag een unieke bezienswaardigheid wil bezoeken, is het Old Operating Theatre Museum een perfecte plaats om te ontdekken. Dit is een museum over de geschiedenis van de chirurgie, je kan er ook een van de oudste operatiekamers bezoeken.","In de 17e eeuw werd een kerk en ziekenhuis herbouwd met een zeer grote zolder. Deze zolder kende enkele verschillende functies tot deze in 1822 werd opgebouwd tot een speciale gebouwde operatiekamer. In 1862 werd het ziekenhuis verhuist naar de huidige locatie in Southwark. De operatiekamer werd dan in 1957 herontdekt.","Na 100 jaar niet gebruikt te zijn geweest, werden de zolder en de operatiekamer opnieuw opengesteld voor het publiek, deze keer als museum. Je kan er de operatiekamer, apotheek, tentoonstellingen en artefacten vinden."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/28.jpg","credit":"The original uploader was MykReeve at English Wikipedia. · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Old-op-the-lond.jpg"}},{"id":29,"name":"London Bridge","district":"Southwark","cats":["see"],"page":30,"lat":51.507999,"lon":-0.087765,"url":null,"text":["De London Bridge is een van de bekendste bruggen in Londen. Deze verbindt de City of London met Southwark. De brug werd meermaals herbouwd over de eeuwen heen, met de huidige brug die teruggaat tot 1971.","De eerste bruggen gaan terug tot 50 na Christus en bestonden uit hout. In 1176 kwam er de eerste stenen brug onder bevel van Hendrik II. De brug was in totaal 282 meter lang. De brug werd gedeeltelijk verwoest door de Grote Brand van Londen in 1666. In 1756 kwam er de London Bridge Act, waardoor de City Corporation de bevoegdheid kreeg om alle eigendommen rond de brug te kopen. Deze werden gesloopt en de brug kon worden verbeterd. Een tijdelijke brug werd gebouwd om het verkeer gaande te houden terwijl de brug werd vernieuwd. Een Victoriaanse Brug werd voltooid in 1831, deze had alsook bogen.","Nadien werd de brug verkocht aan een ondernemer uit Missouri. Deze bouwde er in 1971 een nieuwe brug met extra verstevigingen om het gewicht van modern verkeer te kunnen ondersteunen."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/29.jpg","credit":"Jordiferrer · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:London_Bridge_from_St_Olaf_Stairs.jpg"}},{"id":30,"name":"London Bridge Experience","district":"Southwark","cats":["see"],"page":30,"lat":51.506381,"lon":-0.088491,"url":"https://thelondonbridgeexperience.com/","text":["Vlakbij de London Bridge kan je de London Bridge Experience vinden. Deze attractie neemt toeristen mee doorheen de geschiedenis van London waarbij verschillende sets en acteurs belangrijke momenten uit de geschiedenis aanhalen. Dit zijn voornamelijk donkere momenten zoals de Grote Brand van Londen, een middeleeuwse ontmoeting met Vikingen en ook gevechten met Romeinen. Hier kan je ook de gehele geschiedenis vinden van alle bruggen die op deze locatie gestaan hebben.","De London Tombs is een andere attractie dat ook inbegrepen is in het toegangsticket tot de London Bridge Experience. Hier worden duistere verhalen, zoals Jack the Ripper en William Wallace, tentoongesteld. De tentoonstelling zal zo’n 45-60 minuten in beslag nemen en er wordt gevraagd zeker 15 minuten om voorhand aan te komen, dit om de tentoonstellingen optijd te laten beginnen. Er is ook een kindvriendelijke tour, de Guardian Angel Tour, waarbij zombies niet door de show lopen. Ze krijgen een ‘guardian angel’ mee die hen begeleidt."],"shop":[],"links":[{"label":"Koop hier een toegangsticket voor de London Bridge Experience & Tombs.","url":"https://www.getyourguide.nl/londen-l57/london-bridge-experience-en-tombs-ticket-en-audiogids-t52173/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"photo":{"src":"photos/30.jpg","credit":"Jordiferrer · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:London_Bridge_from_St_Olaf_Stairs.jpg"}},{"id":31,"name":"Southwark Cathedral","district":"Southwark","cats":["see"],"page":31,"lat":51.506376,"lon":-0.089392,"url":"http://www.cathedral.southwark.anglican.org/","text":["Vlakbij de London Bridge Expierence ligt de Southwark Cathedral. De volledige naam is Cathedral and Collegiate Church of St Saviour and St Mary Overie. Dit is de moederkerk van het bisdom Southwark en werd pas de titel van kathedraal tot het de moederkerk werd van het bisdom in 1905. Deze werd gebouwd in 1106 en maakte deel uit van een geheel gewijd aan de Maagd Maria. Het gebouw werd in de 19e eeuw gerenoveerd, maar behield wel onderdelen van de gotische structuur uit de 13e en 15e eeuw.","De kathedraal wordt ook gebruikt voor het uitreiken van eredoctoraten van London South Bank University, afstudeerceremonies door Regent’s College en voor uitreikingen voor medische en tandheelkundige diploma’s door King’s College London. Er zijn nog andere evenementen dat hier plaatsvinden."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/31.jpg","credit":"Ethan Doyle White · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Northwest_View_of_Southwark_Cathedral_(01).jpg"}},{"id":32,"name":"Borough Market","district":"Southwark","cats":["see","shop"],"page":31,"lat":51.505661,"lon":-0.090463,"url":"https://boroughmarket.org.uk/","text":["Indien je wil genieten van een leuk marktdagje, dan kan je best naar de Borough Market gaan. Deze markt is elke dag geopend, buiten op maandag. Je kan er verschillende voedselstandjes vinden, net zoals een gewone markt. Deze locatie is overdekt en bevat ook enkele restaurants en bars.","De markt heeft een geschiedenis dat zo’n 1000 jaar teruggaat. Het begon met de London Bridge, deze verbond de City of London met Southwark. Het zuiden van London werd toen gezien als een plaats voor criminaliteit, waardoor deze negatief werd onthaald. Er ontstonden twee markten, maar in 1270 kwam er een verbod voor inwoners van de city op handelswaar kopen op de markten in Southwark. De markten mochten niet op of nabij de brug plaatsvinden. In 1406 kregen de bewoners toch het recht om de markt te bezoeken. In 1550 werd de markt uitgebreid en was deze vier dagen open in plaats van twee dagen.","In 1676 werd het markthuis vernietigd door een hevige brand, bijna 100 jaar later werd deze toch opnieuw gebouwd, op een andere locatie. In 1756 was de markt operationeel zoals we deze nu kennen. In 1862 kwam er een spoorlijn vlak over de markt. Hierdoor groeide de markt enorm uit. In 1933 waren er zo’n 188 kraampjes en 81 verschillende groothandelsbedrijven in Borough Market aanwezig. Ook na de oorlog was deze plaats voornamelijk de plaats waar groenten en fruit gekocht werd, dit tot de komst van supermarkten. In 1998 werd de markt opnieuw populairder, dankzij het kwalitatief aanbod van biologische en artisanale producten."],"shop":["Indien je wil genieten van een leuk marktdagje, dan kan je best naar de Borough Market gaan. Deze markt is elke dag geopend, buiten op maandag. Je kan er verschillende voedselstandjes vinden, net zoals een gewone markt. Deze locatie is overdekt en bevat ook enkele restaurants en bars.","De markt is een perfecte keuze voor je lunch of dinner, dit aangezien je tal van verschillende kramen, culturen en restaurants terug kan vinden. Er is voor ieder wat wils."],"links":[{"label":"Boek hier een culinaire tour doorheen Borough Market.","url":"https://www.getyourguide.nl/londen-l57/londen-exclusieve-culinaire-tour-door-borough-market-bakles-t957442/?partner_id=W38F18N&cmp=citygids_london"}],"top":true,"photo":{"src":"photos/32.jpg","credit":"Øyvind Holmstad · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:London_2018_March_IMG_0663.jpg"}},{"id":33,"name":"Golden Hinde","district":"Southwark","cats":["see"],"page":33,"lat":51.507073,"lon":-0.090308,"url":"https://www.goldenhinde.co.uk/","text":["De Golden Hinde is een prachtige replica van het prachtige schip waar sir Francis Drake een wereldreis mee maakte tussen 1577 en 1580. In totaal vertrokken er vijf schepen met 164 bemanningsleden op wereldreis in december 1577. In 1578 bereikte hij Brazilië en in maart 1579 veroverde de Golden Hinde het Spaanse schip Nuestra Señora de la Concepción. Het Spaanse schip had de grootste schat ooit veroverd aan boord met een waarde van 380.000 pesos, vandaag zo’n 430 miljoen euro. De schat overbrengen naar de Golden Hinde nam zo’n zes dagen in beslag.","In 1580 kwam sir Drake terug aan in Plymouth met 56 van de oorspronkelijk 80 bemanningsleden aan boord van de Golden Hinde. Het oorspronkelijke schip lag daarna aan de monding van de Thames in Deptford als museumschip, tot deze werd afgebroken in 1650.","In 1973 werd er een replica van het schip gebouwd op ware grootte van het oorspronkelijke schip. Net zoals het originele schip, heeft de replica ook een wereldreis gemaakt. Sinds 1996 ligt het aangemeerd in Soutwark. Je kan het schip bezoeken en meer leren over de geschiedenis ervan."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/33.jpg","credit":"Jose L. Marin · CC BY 2.5","page":"https://commons.wikimedia.org/wiki/File:Francis-drake-galleon-southwark-london-uk.jpg"}},{"id":34,"name":"The Ferryman’s Seat","district":"Southwark","cats":["see"],"page":33,"lat":51.508145,"lon":-0.0956,"url":null,"text":["Aan de London Bankside vind je de Ferryman’s Seat terug, vlakbij de Southwark Bridge. De stoel is gemaakt van vuursteen en is hoogst waarschijnlijk afkomstig uit de 12e en 13e eeuw, al is de exacte leeftijd onbekend. Deze bezienswaardigheid ligt aan de zijkant van een Grieks Restaurant en ligt vlakbij tal van andere bezienswaardigheden, zoals de Shakespeare’s Globe Theatre en de Golden Hinde."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/34.jpg","credit":"the wub · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Ferryman%27s_seat,_Bankside,_London.jpg"}},{"id":35,"name":"Shakespeare’s Globe","district":"Southwark","cats":["see"],"page":34,"lat":51.508113,"lon":-0.097179,"url":"https://shakespearesglobe.com","text":["In Southwark werd er in 1599 een theater gebouwd, het Globe Theatre. Het werd gebouwd voor het Shakespeares toneelgezelschap, de Lord Chamberlain’s Men. In 1613 werd het theater verwoest door een brand. Het theater werd herbouwd in 1614 op dezelfde locatie en bleef geopend tot de sluiting van de Londense theaters in 1642.","Een moderne versie van de Globe werd in 1997 geopend op zo’n 200 meter van de locatie van het oorspronkelijke theater. Deze kreeg de naam Shakespeare’s Globe Theatre en werd gebouwd gebaseerd op bewijs van de gebouwen uit 1599 en 1614. Regisseur Sam Wanamaker heeft de moderne versie van het theater gebouwd en bouwde alsook het Sam Wanamaker Playhouse, een klein overdekt theater.","Er worden verschillende voorstellingen gegeven, meestal tussen mei en oktober. Voor de rest wordt het theater gebruikt voor educatieve doeleinden. Binnen in het theater zijn er ook tentoonstellingen. Er kunnen ook rondleidingen gevolgd worden. In de winter worden er in het Sam Wanamaker Playhouse theatervoorstellingen gehouden, omdat het grote theater dan niet gebruikt kan worden.","Vlak naast het theater is er een restaurant Swan Bar&Restaurant, waar je kan genieten van een drankje, afternoon tea, brunch en een lekkere warme maaltijd. Het theater heeft ook een souvenirwinkel."],"shop":[],"links":[{"label":"Geniet van een rondleiding door het Shakespear’e Globe Theatre.","url":"https://www.getyourguide.nl/londen-l57/londen-shakespeare-s-globe-theatre-rondleiding-t705292/?partner_id=W38F18N&cmp=citygids_london"}],"top":true,"photo":{"src":"photos/35.jpg","credit":"Diego Delso · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Restaurante_The_Swan,_Londres,_Inglaterra,_2014-08-11,_DD_113.jpg"}},{"id":36,"name":"Millennium Bridge","district":"Southwark","cats":["see"],"page":35,"lat":51.509577,"lon":-0.098402,"url":null,"text":["Er zijn veel verschillende bruggen in Londen, een van de meest speciale bruggen is de Millennium Bridge. De officiële naam van de brug is de London Millennium Footbridge en werd gebouwd in 1998 en werd geopend in 2000.","De brug kreeg de bijnaam ‘Wobbly Bridge’ en zelfs ‘Wibbly Wobbly’, dit omwille van alarmerende schommelbewegingen tijdens de openingsdag. De brug werd dan twee jaar lang gesloten om reparaties en aanpassingen uit te voeren. De brug werd in 2002 heropend. De brug heeft een totale lengte van 325 meter en is zo’n 4 meter breed.","De brug komt ook voor in Harry Potter en de Haflfbloed Prins en is ook te zien in Guardians of the Galaxy."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/36.jpg","credit":"Ibex73 · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Millenium_bridge_2015.jpg"}},{"id":37,"name":"Tate Modern","district":"Southwark","cats":["see"],"page":36,"lat":51.507629,"lon":-0.099369,"url":"http://www.tate.org.uk/","text":["Als je van kunst houdt, dan is een van de grootste musea voor moderne en hedendaagse kunst ter wereld een mooie bezienswaardigheid. Het Tate Modern bevindt zich in Southwark vlakbij de Millennium Bridge. Toegang tot het museum is gratis, waardoor je volledig kan genieten van alle prachtige stukken die hier tentoongesteld staan.","In 2000 werd het museum hier gevestigd, het gebouw was daarvoor een Power Station maar werd omgebouwd voor het kunstmuseum. Daarvoor was het museum te vinden in Westminster waar het sinds 1897 tot 2000 te vinden was.","De kunst dateert van 1900 tot nu. Er zijn verschillende gebouwen en afdelingen te vinden. Er zijn verschillende liften in de gebouwen en in het Blavatnik gebouw krijg je op het bovenste","verdiep een uitzicht over Londen. Het gebouw bevat ook een restaurant, verschillende bars en een souvenirshop."],"shop":[],"links":[{"label":"Verken het prachtige Tate Modern met een rondleiding doorheen de galerie.","url":"https://www.getyourguide.nl/londen-l57/londen-tate-modern-tour-met-kunstexpert-t494927/?partner_id=W38F18N&cmp=citygids_london"}],"top":true,"photo":{"src":"photos/37.jpg","credit":"Acabashi · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Tate_Modern_-_Bankside_Power_Station.jpg"}},{"id":38,"name":"Waterloo Bridge","district":"Lambeth","cats":["see"],"page":38,"lat":51.508942,"lon":-0.116868,"url":null,"text":["Om van Lambeth naar Westminster te gaan kan je de Waterloo Bridge oversteken. Het is een brug voor zowel voetgangers als voertuigen. Vanop de brug krijg je een goed uitzicht over Westminster, City of London, South Bank en de London Eye.","De eerste brug werd hier gebouwd in 1809-1810. Het was een privébrug en er werd tol gevraagd voor de oversteek. Toen had de brug de naam ‘de Strandbrug’. Na de overwinning bij de Slag van Waterloo in 1816 werd de brug hernoemd naar de ‘Waterloo Bridge’, dit nog voor de brug ooit geopend was. De brug werd als tolbrug geopend in 1817.","In 1930 werd de oorspronkelijke brug gesloopt en vervangen door een nieuwe brug. Het hele prjoct lag stil tijdens de Tweede Wereldoorlog. In 1937 begon in 1937 en in 1942 opende de brug officieel voor het publiek, al was deze pas echt volledig voltooid in 1945. Aangezien mannen schaars waren tijdens de oorlog voor de bouw van de brug, waren het vooral vrouwen in het bouwpersoneel. Hierdoor kreeg de brug de bijnaam ‘The Ladies Bridge’."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/38.jpg","credit":"Tom Arthur · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:River_Thames_and_Waterloo_Bridge,_London-17Aug2009.jpg"}},{"id":39,"name":"National Theatre","district":"Lambeth","cats":["see"],"page":39,"lat":51.507431,"lon":-0.114349,"url":"https://www.nationaltheatre.org.uk","text":["Als je van het theater houdt, dan is het National Theatre een interessante plaats. De officiële naam is het Royal National Theatre. Het is een plaats voor podiumkunster en een theatergezelschap. Het theater werd in 1963 opgericht door Laurence Olivier. Toen vond het theater nog plaats in het Old Vic-theater.","Het theatergezelschap houdt niet enkel producten in het theater, maar voert ook producties uit in theaters over het Verenigd Koninkrijk met een reizend gezelschap. In 1988 kreeg het theater de toestemming op ‘Royal’ toe te voegen aan de naam.","Er zijn drie gebouwen aan het National Theatre: de hoofdzaal ‘Olivier Theatre’, genoemd naar de eerste directeur Laurence Olivier. In deze zaal kunnen 1160 personen zitten. Het tweede","theater is het Lyttelton Theatre, vernoemd naar Olivier Lyttelton, de eerste bestuursvoorzitter van het National theatre. Het gebouw kan zo’n 890 toeschouwers een plaatsje bieden. Het derde gebouw is het Dorman Theatre, vernoemd naar Lloyd Dorfman, de voorzitter van de Travelex Group en filantroop. Hier kan zo’n 400-koppig publiek zitten."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/39.jpg","credit":"Anthony O'Neil · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:The_National_Theatre,_South_Bank,_London_-_geograph.org.uk_-_1861458.jpg"}},{"id":40,"name":"Royal Festival Hall","district":"Lambeth","cats":["see"],"page":40,"lat":51.506173,"lon":-0.116686,"url":"https://www.southbankcentre.co.uk/venues/royal-festival-hall/","text":["Vlakbij de Royal Nationale Theatre ligt het Royal Festival Hall, een concerthal met 2700 zitplaatsen. De bouw startte in 1948 en duurde zo’n 18 maanden voordat de bouw eindigde. In 1951 werd de hal geopend als onderdeel van het Festival of Britain. In 2005-2007 onderging het complex een renovatie, dit om de akoestiek te verbeteren en de indeling van het gebouw aan te passen.","Het gebouw bevat verschillende ontvangstruimtes, bars, restaurants, een studio, een bibliotheek en verschillende zalen. De Clore Ballroom is geschikt voor 440 personen. Het","complex heeft verschillende open ruimten en foyers, deze zijn populair voor verschillende evenementen."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/40.jpg","credit":"Stephen Richards · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Royal_Festival_Hall,_Belvedere_Road_(1).jpg"}},{"id":41,"name":"London Eye","district":"Lambeth","cats":["see"],"page":40,"lat":51.503369,"lon":-0.119441,"url":"https://www.londoneye.com","text":["De meest populaire bezienswaardigheid in Londen is zonder twijfel de London Eye. De London Eye is zo’n 135 meter hoog en is daarmee een van de grootste reuzenraden ter wereld. Het biedt een van de hoogste uitkijkpunten in Londen, met enkel De Shard dat een hoger uitkijkpunt biedt met een hoogte van 244 meter.","Elk jaar trekt de London Eye meer dan 3 miljoen bezoekers. In totaal zijn er 32 capsules met nummering 1-33. Nummer 13 werd niet gebruikt aangezien dit getal ongeluk aanduid. In totaal kunnen er 25 personen in een capsule. Een volledig rondje rond de London Eye duurt minstens 30 minuten.","De London Eye is een symbool van Londen en staat dan ook afgebeeld op de Britse paspoorten. Bij nieuwjaar worden er 2000 stukken vuurwerk afgevuurd vanop de London Eye. Het is ook een populaire plaats voor huwelijksaanzoeken. Sinds de opening in 2000 zijn er al zeker 5000 huwelijksaanzoeken gebeurd op de London Eye.","Vlak naast de London Eye ligt de Jubilee Gardens, een openbaar park dat aangelegd werd in 1977 ter ere van het zilveren jubileum van koningin Elizabeth II. Het werd herontwikkeld in 2012."],"shop":[],"links":[{"label":"Boek hier je ticket voor een Hop-on-Hop-Off-bustour en ontdek de leukste","url":"https://www.getyourguide.nl/londen-l57/london-eye-big-bus-hop-on-hop-off-rondvaart-met-riviercruise-t292175/?partner_id=W38F18N&cmp=citygids_london"}],"top":true,"photo":{"src":"photos/41.jpg","credit":"Khamtran · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:London-Eye-2009.JPG"}},{"id":42,"name":"London Dungeon","district":"Lambeth","cats":["see"],"page":41,"lat":51.502641,"lon":-0.118787,"url":"https://www.thedungeons.com/london/","text":["Londen heeft een interessant verleden met vele historische gebeurtenissen. Enkele van deze gebeurtenissen kan je op een unieke wijze ontdekken in de London Dungeon. Hier worden enkele griezelige en bloederige momenten uit het verleden van de stad uitgebeeld aan de hand van sets en acteurs.","De London Dungeon werd geopend in 1974 en was toen meer een wassenbeeldmuseum dan een spookhuis. Tussen de jaren 80 en 90 werd deze attractie uitgebreid en werden er historische gebeurtenissen, zoals de Grote Brand van Londen en Jack the Ripper. In 1992 werd deze plaats heruitgevonden tot een horrorattractie. Sommige gebeurtenissen waren waargebeurd, andere waren fictief, zoals Sweeney Todd. Er werd meer nadruk gelegd op humor dan historische accuraatheid.","In 2013 verhuisde de London Dungeon, dat oorspronkelijk nabij de Tower of London lag. De huidige locatie is vlakbij de London Eye, dichtbij verschillende andere bezienswaardigheden. Het is vandaag de dag nog steeds een populaire bezienswaardigheid."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/42.jpg","credit":"giggel · CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:London_-_The_London_Dungeon_-_panoramio.jpg"}},{"id":43,"name":"Westminster Bridge","district":"Lambeth","cats":["see"],"page":42,"lat":51.501075,"lon":-0.12207,"url":null,"text":["Westminster Bridge is een brug voor zowel voetgangers als voertuigen. Deze brug verbindt Lambeth met Westminster. Er zijn verschillende bezienswaardigheden vlak aan deze brug, zoals de London Eye, London Dungeons, Houses of Parliament, Big Ben en nog enkele andere vlak in de buurt.","De eerste brug werd gebouwd tussen 1739 en 1750 en had enkele gevolgen. Zo werd de London Bridge verbreed om ervoor te zorgen dat het verkeer niet alleen richting Westminster Bridge ging. West End groeide verder uit, dit aangezien het verkeer er sneller geraakte. Toch verzakte de brug halverwege de 19e eeuw, waardoor er een nieuwe brug nodig was. De brug zoals we die vandaag kennen, werd gebouwd in 1862 en deze bevatte zelfs een tramlijn tussen 1906 en 1952. Vandaag de dag wordt de brug elke dag actief gebruikt door talloze toeristen om de bezienswaardigheden in de buurt te bezoeken. Op de brug vind je verschillende artiesten terug die bezoekers van de stad entertainen."],"shop":[],"links":[{"label":"Ontdek de donkere geschiedenis van London tijdens een bezoek aan de","url":"https://www.getyourguide.nl/londen-l57/toegangstickets-voor-de-london-dungeon-t174546/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"photo":{"src":"photos/43.jpg","credit":"Martin Dunst · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Westminster_Bridge_and_Palace_of_Westminster.jpg"}},{"id":44,"name":"Imperial War Museum","district":"Lambeth","cats":["see"],"page":43,"lat":51.495933,"lon":-0.108684,"url":null,"text":["Niet zo ver van Westminster Bridge vind je het Imperial War Museum. In 1917 werd het museum opgericht en het heeft nu reeds vijf vestigingen. De bedoeling was om de burgeroorlog en de militaire inpanningen en offers van het Verenigd Koninkrijk tijdens de Eerste Wereldoorlog.","Ondertussen werd het werkterrein uitgebreid waardoor het museum alle conflicten omvat waarbij Britse of Commonwealth-troepen sinds 1914 bij betrokken zijn geweest. Het museum is perfect voor iedereen die meer wil leren over de geschiedenis van moderne oorlog en oorlogservaringen.","In 1920 opende het museum voor het eerst zijn deuren. In 1936 werd het Museum verplaatst naar de huidige locatie. Het museum kent verschillende afdelingen en locaties. Zo behoort de HMS Belfast in Southwark tot het Imperial War Museum, alsook de Churchill War Rooms in Westminster.","Het museum bevat archieven, documenten, foto’s, film-en beeldmateriaal, kunst en voorbeelden van voertuigen, vliegtuigen, uitrusting en artefacten. De toegang voor IWM","Londen is gratis, al wordt er wel een inkom gevraagd voor bepaalde tentoonstellingen. Er is een café waar je zowel eten als drinken kan verkrijgen. Er zijn ook onderzoeksruimtes en er is ook een souvenirshop."],"shop":[],"links":[{"label":"Ontdek Westminster met een begeleide tour langs de leukste","url":"https://www.getyourguide.nl/londen-l57/skip-the-line-westminster-abbey-wandeltour-door-het-centrum-van-londen-t512555/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"photo":{"src":"photos/44.jpg","credit":"Imperial War Museum · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Imperial_War_Museums_logo.svg"}},{"id":45,"name":"Palace of Westminster","district":"Westminster","cats":["see"],"page":46,"lat":51.499476,"lon":-0.124709,"url":null,"text":["Een van de bekendste gebouwen in Londen is het Palace of Westminster, ook gekend als het Houses of Parliament. De bijnaam werd gegeven omdat het paleis het House of Commons en House of Lords bevat, de twee wetgevende kamers. Hier vinden veel politieke gebeurtenissen plaats. Het paleis heeft een toren, de Elizabeth Tower. Deze toren bevat een klok dat ook gekend is als Big Ben en het is een herkenningspunt van Londen. Het paleis staat sinds 1970 op de Werelderfgoedlijst van UNESCO.","Het paleis werd gebouwd als koninklijk paleis in de 11e eeuw en het werd tot 1512 gebruikt als koninklijke residentie. Een brand verwoestte de koninklijke vertrekken, waardoor de koninklijke residentie verhuisde naar Palace of Whitehall. In 1834 verwoestte een tweede en grotere brand het grootste deel van het paleis, met uitzondering van Westminster Hall. Deze ruimte werd opgenomen in het nieuwe gebouw. Over de jaren heen werden er nog renovaties uitgevoerd.","Verschillende gebeurtenissen zorgden voor een interessante geschiedenis, een van de bekendste is het Gunpowder Plot. In 1605 vond er een plot plaats om koning James II te vermoorden. Er werden grote aantallen buskruitvaten geplaatst onder de House of Lords en het was de bedoeling dat Guy Fawkes, een van de samenzweerders, dit zou doen ontploffen. Het complot werd ontdekt, waardoor de meeste samenzweerders ofwel gevangen werden, ofwel omkwamen tijdens het vluchten. De overlevenden werden naar de Tower of London gebracht, waar ze gemarteld en geëxecuteerd werden. Sinds deze gebeurtenis worden de kelders telkens onderzocht door de Yeomen guards.","Je kan het paleis bezoeken, al moet je rekening houden met de regels die worden doorgevoerd. Eten, drinken en roken wordt verboden. Foto’s maken is toegestaan in sommige ruimtes, maar Ontdek met een begeleide tour langs de leukste bezienswaardigheden.","niet alle ruimtes van het paleis. Er is een souvenirshop en een café aanwezig in het gebouw. Je kan via de officiële website verschillende tours boeken. Tickets zijn nodig om het gebouw te betreden."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/45.jpg","credit":"ThatsTheBoss · CC0","page":"https://commons.wikimedia.org/wiki/File:Palace_of_Westminster_as_seen_from_Westminster_Bridge.jpg"}},{"id":46,"name":"Big Ben","district":"Westminster","cats":["see"],"page":46,"lat":51.500785,"lon":-0.124622,"url":null,"text":["De Elizabeth Tower bevat een klok met de bijnaam Big Ben, al wordt deze naam ook gebruikt voor de volledige toren. Oorspronkelijk werd de toren gewoon de Clock Tower genoemd, maar deze werd in 2012 omgedoopt tot de Elizabeth Tower, dit omwille van het diamenten jubileum van Elizabeth II.","De toren werd voltooid in 1859, deze is 96 meter hoog en bevat 334 treden. Bij afwerking was dit de nauwkeurigste slag- en luidklok ter wereld. De bel werd gegoten door Whitechapel Bell Foundry en weegt 13,5 ton. Tussen 2017 en 2021 werden zowel de toren als de klok gerenoveerd. De klokkentoren staat sinds 1987 op de Werelderfgoedlijst UNESCO."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/46.jpg","credit":"Christian David · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Elizabeth_Tower_and_the_north_front_of_the_Palace_of_Westminster,_London.jpg"}},{"id":47,"name":"Jewel Tower","district":"Westminster","cats":["see"],"page":47,"lat":51.498611,"lon":-0.126409,"url":null,"text":["De Jewel Tower was een onderdeel van het originele Palace of Westminster. Het werd toegevoegd aan het paleis in de 14e eeuw. De toren bestond uit drie verdiepingen en werd gebruikt voor de bewaring van de schat en persoonlijke bezittingen van de vorst, dit tot 1512. Nadien werd het gebruikt voor de opslag van parlementaire archieven en werd hiervoor gebruikt tot de 18e eeuw. Het was een van de vier gebouwen dat de brand van 1834 overleefde. In 1956 werd de toren geopend voor bezoekers."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/47.jpg","credit":"No machine-readable author provided. Lonpicman~commonswiki assumed (based on cop · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Jewel_Tower.jpg"}},{"id":48,"name":"Westminster Abbey","district":"Westminster","cats":["see"],"page":47,"lat":51.499549,"lon":-0.127397,"url":"https://www.westminster-abbey.org","text":["Vlakbij de Jewel Tower en het Palace of Westminster vind je een bekende Anglicaanse kerk, Westminster Abbey. Officieel noemt deze kerk Collegiate Church of Saint Peter at Westminster. De huidige kerk werd gebouwd tussen 1245 en 1269. Daarvoor stond er een andere abdij op deze plaats sinds 959.","De kerk werd gebouwd in de gotische stijl met spitsbogen, glas-in-loodramen en gewelven. De kerk bevat twee torens die werden toegevoegd in de 18e eeuw. Sinds 1066 worden hier de monarchen gekroond, waarvan de kroningsstoel nog steeds in gebruik is. Vele koninklijke huwelijken en staatsbegrafenissen vonden reeds plaats in deze kerk. Zo liggen hier ook veel prominente figuren begraven, zoals Isaac Newton, Charles Darwin, Stephen Hawking, Geoffrey Chaucer, Charles Dickens en Thomas Hardy.","De Abbey is een populaire toeristische trekpleister en het is ook een actieve gebedsplaats. Toegang tot het gebouw is betalend voor toeristen, maar de toegang is gratis voor degenen die graag willen bidden."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/48.jpg","credit":"Antiquary · CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:Westminster_Abbey,_Westminster.jpg"}},{"id":49,"name":"The Cenotaph","district":"Westminster","cats":["see"],"page":48,"lat":51.502809,"lon":-0.12567,"url":null,"text":["Niet ver van het Palace of Westminster vind je een monument dat de slachtoffers uit de beide Wereldoorlog eert, The Cenotaph. Het monument werd voor het eerst ingehuldigd in 1920 na de Eerste Wereldoorlog. Nadien werd het in 1946 opnieuw ingewijd om ook de slachtoffers van de Tweede Wereldoorlog te eren.","The Cenotaph betekent ‘leeg graf’ en is toepasselijk aangezien de zuil de slachtoffers eert. Hier vindt hier Remembrance Sunday plaats, ook wel ‘Poppy Day’ genoemd. De Nationale herdenking op de tweede zondag van november, de zondag het dichtst bij 11 november, waarbij er twee minuten stilte is om 11:00 uur in de voormiddag. Klaprozen worden dan gedragen als eerbetoon."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/49.jpg","credit":"Godot13 · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:UK-2014-London-The_Cenotaph.jpg"}},{"id":50,"name":"The Women of World War II","district":"Westminster","cats":["see"],"page":49,"lat":51.503711,"lon":-0.126269,"url":null,"text":["Tijdens de Tweede Wereldoorlog waren het niet enkel mannen die werk leverden, maar ook de vrouwen gaven een bijdrage. Vrouwen sloten zich aan bij het leger of namen de taken van mannen over. Het monument in Whitehall, The Women of World War II, is een","eerbetoon aan de bijdrage geleverd door vrouwen in oorlogstijden. Het monument toont veerkracht, dienstbaarheid en opoffering. Het beeld is 6,7 meter hoog en omvat verschillende uniformen gedragen door vrouwen tijdens deze oorlogsperiode. Het monument werd onthuld in 2005."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/50.jpg","credit":"Christian David · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Monument_to_the_Women_of_World_War_II,_Whitehall,_London.jpg"}},{"id":51,"name":"10 Downing Street","district":"Westminster","cats":["see"],"page":50,"lat":51.503622,"lon":-0.127589,"url":null,"text":["Number 10, oftewel 10 Downing Street, is een officiële woonst voor de eerste minister (Prime Minister) van het Verenigd Koninkrijk. Het is een van de meest bekende politieke woningen ter wereld en ligt vlakbij Westminster Abbey. Het huis wordt bewaakt en wordt afgesloten door een hek. Het is niet open voor het publiek.","Binnenin vind je verschillende ruimtes met een zakelijke functie, zoals verschillende kantoren, vergaderruimtes en ontvangsruimtes. Er is ook een Cabinet Room, een study, en een traphal met protretten van de voormalige premiers. De bovenste verdiepingen bevatten de woonruimtes."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/51.jpg","credit":"Sergeant Tom Robinson RLC · OGL v1.0","page":"https://commons.wikimedia.org/wiki/File:10_Downing_Street._MOD_45155532.jpg"}},{"id":52,"name":"Churchill War Rooms","district":"Westminster","cats":["see"],"page":50,"lat":51.502479,"lon":-0.129473,"url":"https://iwm.org.uk/visits/churchill-war-rooms","text":["De Churchill War Rooms maken deel uit van het Imperial War Museum. Het museum bestaat uit de Cabinet War Rooms, een ondergronds complex dat een commandocentrum voor de Britse regering was tijdens de Tweede Wereldoorlog. Verder is er ook nog het Churchill Museum, een museum gewijd aan Winston Churchill.","Het gebouw werd gebouwd tussen 1938-1939 en werden in gebruik gesteld tot 1945. In 1984 werden de Cabinet War Rooms geopend voor het publiek nadat het Imperial War Museum het beheer op zich nam. In 2005 werden er renovatiewerken uitgevoerd en werd het Churchill Museum toegevoegd aan de Cabinet War Rooms. De volledige titel van het museum is het Churchill Museum en Cabinet War Rooms, met Churchill War Rooms als afkorting."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/52.jpg","credit":"MapRoomCabinetWarRooms20060617_CopyrightKaihsuTai.jpg: Kaihsu Tai\nderivative wor · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:MapRoomCabinetWarRoomsTrim.jpg"}},{"id":53,"name":"St James’ Park","district":"Westminster","cats":["see"],"page":51,"lat":51.5027,"lon":-0.134,"url":null,"text":["Een van de oudste koninklijke parken in Londen is St-James’s Park. Het is een prachtige groene oase in het midden van een drukke stad. Het ligt vlak aan Buckingham Palace en nog enkele andere bezienswaardigheden. Het park bevat een meer met tal van bankjes om te genieten van de rust. Er is een café in het park waar je kan genieten van een drankje.","Het park is perfect om te picknicken, vogels te spotten of te genieten van een koffie of lunch. In de zomer is er ook een ijskar aan het park."],"shop":[],"links":[{"label":"Ontdek de Churchill War Rooms en leer meer over de oorlogsinspanningen","url":"https://www.getyourguide.nl/londen-l57/londen-churchill-war-rooms-ticket-politiek-londen-audio-t926494/?"}],"top":false,"fixed":true,"photo":{"src":"photos/53.jpg","credit":"Colin · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:St_James%27s_Park_Lake_%E2%80%93_East_from_the_Blue_Bridge_-_2012-10-06.jpg"}},{"id":54,"name":"St James’ Palace","district":"Westminster","cats":["see"],"page":52,"lat":51.504875,"lon":-0.137094,"url":null,"text":["Vlak naast St James’s Park vind je twee koninkklijke residenties. St. James’s Palace is een van deze residenties. Dit is het oudste koninklijke paleis in Londen. Het werd vroeger gebruikt als hoofdwoonplaats van de monarch, al is dit niet meer het geval. Het huis wordt tegenwoordig gebruikt voor officiële zaken zoals ceremoniële vergaderplaats van de Toetredingsraad en het is het kantoor van de maarschalk van het diplomatieke korps.","Het huis werd gebouwd door Koning Hendrik VIII als een toevluchtsoord om even te ontsnappen aan het hof. Soms werd het gebruikt als koninklijke residentie en het werd ook als gastenverblijf gebruikt. In de 19e eeuw werd het vervangen door Buckingham Palace en Clarence House.","Clarence House is de andere koninklijke residentie aan St. James’s Park en werd gebouwd tussen 1825 en 1827. Het huis werd gebouwd voor de hertog van Clarence, oftewel Koning Willem IV van het Verenigd Koninkrijk van 1830 tot 1837. Normaal gezien zou de hertog in St James’s Palace wonen, maar hij vond het te klein. Hij bleef in Clarence House wonen, ook nadat hij koning werd. Officiële zaken handelde hij af in St James’s Palace, waar hij een directe doorgang naartoe liet bouwen.","Verschillende royals verbleven sinds toen in Clarence House. Onder andere Prinses Margaret, Pri
