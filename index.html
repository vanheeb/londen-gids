ns William en Prins Harry verbleven enige tijd in het huis. Voorlopig gebruikt Koning Charles","III en zijn vrouw, Koningin Camilla, het huis tot 2027. Dit omwille van de renovatiewerken in het Buckingham Palace."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/54.jpg","credit":"Tony Hisgett from Birmingham, UK · CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:St_Jamess_Palace.jpg"}},{"id":55,"name":"Clarence House","district":"Westminster","cats":["see"],"page":52,"lat":51.50419,"lon":-0.138558,"url":null,"text":["Vlak naast St James’s Park vind je twee koninkklijke residenties. St. James’s Palace is een van deze residenties. Dit is het oudste koninklijke paleis in Londen. Het werd vroeger gebruikt als hoofdwoonplaats van de monarch, al is dit niet meer het geval. Het huis wordt tegenwoordig gebruikt voor officiële zaken zoals ceremoniële vergaderplaats van de Toetredingsraad en het is het kantoor van de maarschalk van het diplomatieke korps.","Het huis werd gebouwd door Koning Hendrik VIII als een toevluchtsoord om even te ontsnappen aan het hof. Soms werd het gebruikt als koninklijke residentie en het werd ook als gastenverblijf gebruikt. In de 19e eeuw werd het vervangen door Buckingham Palace en Clarence House.","Clarence House is de andere koninklijke residentie aan St. James’s Park en werd gebouwd tussen 1825 en 1827. Het huis werd gebouwd voor de hertog van Clarence, oftewel Koning Willem IV van het Verenigd Koninkrijk van 1830 tot 1837. Normaal gezien zou de hertog in St James’s Palace wonen, maar hij vond het te klein. Hij bleef in Clarence House wonen, ook nadat hij koning werd. Officiële zaken handelde hij af in St James’s Palace, waar hij een directe doorgang naartoe liet bouwen.","Verschillende royals verbleven sinds toen in Clarence House. Onder andere Prinses Margaret, Prins William en Prins Harry verbleven enige tijd in het huis. Voorlopig gebruikt Koning Charles","III en zijn vrouw, Koningin Camilla, het huis tot 2027. Dit omwille van de renovatiewerken in het Buckingham Palace."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/55.jpg","credit":"ChrisO · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Clarence_house.jpg"}},{"id":56,"name":"Green Park","district":"Westminster","cats":["see"],"page":53,"lat":51.504102,"lon":-0.143436,"url":null,"text":["Nabij Clarence House vind je het prachtige Green Park. Dit is een van de acht koninklijke parken van Londen. Vlakbij Green Park vind je Buckingham Palace, St. James’s Park en Hyde Park. In de 17e eeuw werd het park aangelegd door Koning Charles II en bevat geen vijvers, fonteinen of bloemen. Het is een simpel open park met groene grasvelden. Het park is perfect om even te ontsnappen aan de drukte van de stad. Je kan er wandelen, picknicken en gewoon genieten van de rust.","Er is een verhaal dat zou kunnen verklaren waarom Green Park geen bloemen heeft. Koningin- Consort Catherine van Braganza zou ontdekt hebben dat haar man, Koning Charles II, bloemen","zou geplukt hebben in het park voor een andere vrouw. Als wraak zou ze alle bloemen hebben laten verwijderen met een verbod dat er geen nieuwe bloemen gepland zouden mogen worden."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/56.jpg","credit":"Diliff · CC BY 2.5","page":"https://commons.wikimedia.org/wiki/File:Green_Park,_London_-_April_2007.jpg"}},{"id":57,"name":"Buckingham Palace","district":"Westminster","cats":["see"],"page":53,"lat":51.501458,"lon":-0.14188,"url":"https://rct.uk/visit/buckingham-palace","text":["Een van de bekendste koninklijke residenties in de wereld is Buckingham Palace. Dit is de koninklijke residentie en het administratieve hoofdkwartier van de monarch van het Verenigd Koninkrijk.","In 1703 werd het Buckingham Palace gebouwd als Buckingham House. Toen was het nog een groot herenhuis en het werd gebouwd voor de hertog van buckingham en Normanby. Nadien gebruikte Koningin Charlotte het als privéwoonst en werd het The Queen’s House genoemd. In de 19e eeuw werd het herenhuis uitgebreid met extra vleugels rond de centrale binnenplaats. Koningin Victoria gebruikte het sinds 1837 dan als hoofdwoonplaats waardoor het Buckingham Palace werd genoemd.","Tijdens de Tweede Wereldoorlog werd het paleis verschillende keren gebombardeerd. Hierdoor werd de paleiskapel vernietigd en veel ramen alsook kapot waren. Na de oorlog werd het paleis gerestaureerd.","Het paleis heeft aan de achterkant een grote tuin dat meer op een park lijkt dan op een tuin. Het is de grootste privétuin in Londen en elk jaar worden er verschillende tuinfeesten gehouden, alsook andere evenementen. Er is een landingsplaats voor helikopters, een meer en een tennisbaan.","Het paleis kan je bezoeken, al moet je wel een ticket aankopen voor toegang. De prijzen kan je online bekijken, want deze kunnen variëren. Je kan ook kiezen voor een bezoek met rondleiding onder begeleiding van een gids indien gewenst.","Net voor het Buckingham Palace staat het Victoria Memorial. Het monument is een eerbetoon aan Koningin Victoria en werd voltooid in 1924. Het bevat fonteinen en trappen en het is een populaire toeristische attractie."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/57.jpg","credit":"Julian Herzog (Website) · CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:Buckingham_Palace_London_Morning_2020_01_(cropped).jpg"}},{"id":58,"name":"Westminster Cathedral","district":"Westminster","cats":["see"],"page":54,"lat":51.4964,"lon":-0.1394,"url":null,"text":["In 1903 werd er een rooms-katholieke kerk gebouwd in Westminster, dit met de officiële naam Metropolitan Cathedral of the Most Precious Blood of kortweg Westminster Cathedral. Hier zetelt de aartsbisschop van Westminster.","De kathedraal heeft een klokkentoren van 87 meter hoog. Binnen de kathedraal vind je prachtige mozaïeken, zijkapellen en indrukwekkende marmer. De kerk is dagelijks geopend voor het publiek voor iedereen die willen bidden, voor de mis en voor speciale evenementen zoals Kerstmis, Pasen en herdenkingsmissen.","Je kan de toren beklimmen voor een panoramisch uitzicht over Londen, dit kan met de lift. Er is een koffiezaal en er is een winkel voor bezoekers."],"shop":[],"links":[{"label":"Boek hier je toegangsticket tot Buckingham Palace en ervaar de wisseling","url":"https://www.getyourguide.nl/buckingham-palace-l2706/londen-buckingham-palace-en-de-wisseling-van-de-wacht-t49917/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"fixed":true,"photo":{"src":"photos/58.jpg","credit":"Diego Delso · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Catedral_de_Westminster,_Londres,_Inglaterra,_2022-11-23,_DD_22-24_HDR.jpg"}},{"id":59,"name":"Hyde Park Corner","district":"Westminster","cats":["see"],"page":55,"lat":51.503077,"lon":-0.150858,"url":null,"text":["Hyde Park Corner ligt aan een groot kruispunt aan de hoek van Hyde Park, Green Park en Buckingham Palace Garden. Er is een grote rotonde op het kruispunt waar de Wellington Arch staat. De Wellington Arch ondersteunt een beeld van de 1e Hertog van Wellington, de held van Waterloo.","In totaal komen er zes straten samen op deze hoek en is het een toegang tot Hyde Park. Vlak naast Hyde Park Corner ligt het Apsley House Museum, dit was het herenhuis van de eerste Hertog van Wellington en gaat terug tot de 18e eeuw. Dit huis staat opengesteld als museum en kunstgalerij en de helft van het huis wordt nog steeds gebruikt voor privé door de huidige Hertog van Wellington."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/59.jpg","credit":"Wikimedia Commons · Public domain","page":"https://commons.wikimedia.org/wiki/File:Shotter_Boys_Hyde_Park_Corner,_1842_edited.jpg"}},{"id":60,"name":"Hyde Park","district":"Westminster","cats":["see"],"page":55,"lat":51.507898,"lon":-0.164479,"url":null,"text":["Een van de grootste parken van Londen ligt vlakbij Buckingham Palace en aan Hyde Park Corner. Hyde Park vormt samen met Kensinton Gardens één geheel met Serpentine Lake en The Long Water Lake in het midden. Het is net als Kensington Gardens, St. James’s Park en Green Park een van de koninklijke parken in het centrum van Londen. Oorspronkelijk werd het gebruikt als jachtgevied en in 1637 werd het opengesteld voor het publiek.","In het park vind je veel verschillende monumenten en standbeelden terug. Zo is er een memorial voor de Holocaust en is er ook een standbeeld van Achilles. Er is een Memorial voor Prinses Diane en er is een unieke plaats vrij voor debatten, Speaker’s Corner. De laatste twee worden later in de gids besproken.","Het park is een plaats waar veel verschillende evenementen en gebeurtenissen plaatsvinden, zowel in het verleden, heden en in de toekomst. Zo hebben er duels plaatsgevonden, werd het gebruikt als militair kamp tijdens de Grote Pest van Londen in 1665, was er een grote kermis in 1814 ter ere van de geallieerde vorsten aan Engeland, vond er de Great Exhibition van 1851 plaats, net als verschillende jubilea en festiviteiten.","Jaarlijks zijn er verschillende evenementen die nog plaatsvinden in het park, zoals het Winter- Wonderland. Er vinden ook nog steeds concerten en sportactiviteiten plaats."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/60.jpg","credit":"@LondonNPC #NationalParkCity · CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Hyde_Park_London_from_the_air.jpg"}},{"id":61,"name":"Speaker’s Corner","district":"Westminster","cats":["see"],"page":56,"lat":51.511046,"lon":-0.158738,"url":null,"text":["Hyde Park bevat ook Speaker’s Corner, een plek voor vrije meningsuiting, openbare toespraken, debatten en discussies. Iedereen krijgt er de kans om vrijuit te kunnen spreken op een openbare plaats. Het bestaat als sinds de 19e eeuw en werd vroeger vooral gebruikt voor debatten en toespraken over politiek, religie of de maatschappij.","Iedereen mag er het woord nemen en je bent vrij om deel te nemen aan de discussies of om vragen te stellen. Dit zolang de vrede behouden wordt. Elke zondagochtend en zondagmiddag is deze plek het druksts."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/61.jpg","credit":"GeorgeLouis · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Orator_at_Speakers_Corner,_London,_with_crowd,_1974.jpg"}},{"id":62,"name":"Diana, Princess of Wales Memorial Fountain","district":"Westminster","cats":["see"],"page":56,"lat":51.505003,"lon":-0.171685,"url":null,"text":["Een van de vele bezienswaardigheden in Hyde Park is de Diana, Princess of Wales Memorial Fountain. Het is een prachtig gedenkteken ter nagedachtenis aan Diana, Prinses van Wales. De fontein ligt in het zuiden van Hyde Park, net naast Kensington Gardens. De bouw startte in 2003 en het werd officieel geopend in 2004. Bij de opening waren Koningin Elizabeth II, Charles Spencer, Prins Charles, Prins William en Prins Harry aanwezig, net als tal van andere familieleden."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/62.jpg","credit":"C. G. P. Grey · CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Diana,_Princess_of_Wales_Memorial_Fountain.JPG"}},{"id":63,"name":"Harrods","district":"Westminster","cats":["see"],"page":58,"lat":51.499481,"lon":-0.163262,"url":"https://www.harrods.com","text":["Onder Hyde Park kom je nog enkele bezieswaardigheden tegen. Harrods is een van de eerste plaatsen waar je zeker een bezoekje moet maken wanneer je Hyde Park verlaat. Dit is een luxueus warenhuis met een oppervlakte van 100.000 vierkante meter, waardoor het het grootste warenhuis in Europa is.","De eerste winkel werd gesticht in 1849 door Charles Henry Harrod, maar brandde af in 1883. In 1905 werd de tweede winkel gebouwd door CW Stephens en Charles Digby Harrod.","Het warenhuis heeft 330 verschillende afdelingen en biedt dus een breed aanbod aan producten. Je vindt er onder andere kledij, elektronica, sieraden, sportartikelen, speelgoed, parfumerie, make-up, huishoudelijke artikelen, meubels, artikelen voor huisdieren, bruidskledij en nog veel meer. Er zijn zo’n 23 restaurants, waardoor je echt alle mogelijke maaltijden kan benuttigen in het warenhuis: high tea, tapas, haut cuise en ook lichtere maaltijden.","Het is mogelijk hier een hele dag te vertoeven, houd er wel rekening mee dat het een luxueus warenhuis is en dat de prijzen van de producten relatief hoog liggen afhankelijk van welke afdeling je bezoekt."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/63.jpg","credit":"user: Sokkk y · Public domain","page":"https://commons.wikimedia.org/wiki/File:Harrods_(London).jpg"}},{"id":64,"name":"Brompton Oratory","district":"Westminster","cats":["see"],"page":59,"lat":51.497137,"lon":-0.169514,"url":null,"text":["Een belangrijke kerk in Londen is Brompton Oratory, een neoklassieke kerk in Westminster. De officiële naam is church of the Immaculate Heart of Mary. De kerk is in Londen gewoon gekend als ‘Brompton Oratory’, ‘Londen Oratory’ of simpelweg ‘The Oratory’.","De priesters van de kerk vieren nog elke dag de mis, waardoor alle bezoekers welkom zijn. De kerk is gekend voor de muziek en musici die er optreden, zo zijn er drie koren in de kerk. Ook is het de plaats waar verschillende bruiloften en ceremonies plaatsvonden, zoals het huwelijk van Alfted Hitchcock en Alma Reville."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/64.jpg","credit":"David Castor (dcastor) · Public domain","page":"https://commons.wikimedia.org/wiki/File:Brompton_Oratory-2.jpg"}},{"id":65,"name":"Victoria Albert Museum","district":"Westminster","cats":["see"],"page":59,"lat":51.496687,"lon":-0.172205,"url":"https://www.vam.ac.uk","text":["Het V&A, of het Victoria & Albert Museum, ligt in het Westminster district. Het is het grootste museum ter wereld met toegepaste kunst en design en werd opgericht in 1852. Binnenin vind je een collectie van zo’n 2,8 miljoen objecten.","De collectie omvat beeldhouwkunst, keramiek, glas, textiel, kostuums, sieraden, meubels, prenten, middeleeuwse voorwerpen, foto’s en nog tal van andere objecten. Het museum werd ingedeeld in vier afdelingen: Decoratieve Kunst en Beeldhouwkunst; Performance, Meubilair, Textiel en Mode; Kunst, Architectuur, Fotografie en Design; en Azië. In totaal zijn er zestien tentoonstellingsruimtes. Er zijn niet alleen permanente tentoonstellingen, maar ook tijdelijke tentoonstellingen in het museum.","Het museum bevat een souvenirwinkel en je kan er ook workshops meevolgen. Er vinden ook evenementen plaats in het museum."],"shop":[],"links":[{"label":"Ontdek het Victoria & Albert Museum en geniet van een rondleiding terwijl","url":"https://www.getyourguide.nl/londen-l57/londen-rondleiding-victoria-and-albert-museum-t879664/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"photo":{"src":"photos/65.jpg","credit":"Alan Fletcher · Public domain","page":"https://commons.wikimedia.org/wiki/File:Victoria_and_Albert_Museum_Logo.svg"}},{"id":66,"name":"Natural History Museum","district":"Westminster","cats":["see"],"page":60,"lat":51.496775,"lon":-0.176346,"url":"https://www.nhm.ac.uk","text":["Een van de meest indrukwekkende musea van het Verenigd Koninkrijk is het Natural History Museum. Het museum is aan de buitenkant even indrukwekkend als aan de binnenkant dankzij de prachtige architectuur.","Het museum heeft een indrukwekkende collectie en stelt verschillende afdelingen van Natuurlijke Geschiedenis tentoon, dit in vijf categoriën: botanie, entomologie, mineralogie, paleontologie en zoölogie. Het museum is gespecialiseerd in identificatie, taxonomie en behoud van artefacten.","Een van de bekendste objecten in het museum, zijn de dinosaurusskeletten. De zalen en ruimtes hebben hoge plafonds en de objecten worden af en toe op een indrukwekkende manier tentoongesteld, zoals een specimen die aan het plafond hangen.","Het museum is gratis toegankelijk al worden donaties aanvaard. Er zijn verschillende ingangen en verschillende souvenirwinkels in het museum. Er worden workshops gegeven en tal van andere evenementen."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/66.jpg","credit":"Unknown author. · Public domain","page":"https://commons.wikimedia.org/wiki/File:Natural_History_Museum_London_logo_(large).svg"}},{"id":67,"name":"Science Museum","district":"Westminster","cats":["see"],"page":60,"lat":51.497248,"lon":-0.17674,"url":"http://www.sciencemuseum.org.uk/","text":["Vlak achter het Natural History Museum ligt het Science Museum. Het museum werd in 1857 opgericht en is een grote toeristische trekpleister. Er zijn in totaal vijf museum die deel uitmaken van de Science Museum Group en het Science Museum Londen is er één van.","Het is een museum gewijs aan wetenschap, technologie, innovatie en ruimtevaart. Er zijn verschillende tentoonstellingen, zowel voor volwassenen als voor kinderen. Verder zijn er ook tijdelijke tentoonstellingen en evenementen. Er is een café,restaurant en een souvenirwinkel met wetenschappelijk speelgoed, boeken en andere gadgets. Het museum is gratis toegankelijk."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/67.jpg","credit":"Shadowssettle · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Science_Museum,_Exhibition_Road_(cropped).jpg"}},{"id":68,"name":"Royal Albert Hall","district":"Westminster","cats":["see"],"page":61,"lat":51.501056,"lon":-0.177373,"url":"https://www.royalalberthall.com","text":["Net naast Kensington Gardens vind je een van de meest indrukwekkende concertzalen ter wereld: Royal Albert Hall. Het gebouw heeft een indrukwekkende architectuur en een uitstekende akoestiek. Een breed aanbod aan evenementen vindt hier plaats, dit kan gaan van klassieke muziek en ballet tot rockconcerten, filmvertoningen en live concerten.","De zaal werd geopend in 1871 en werd genoemd achter Prins Albert, de echtgenoot van Koningin Victoria. De zaal heeft zo’n 5272 zitplaatsen. Je kan er rondleidingen krijgen binnen in de zaal.","Hier vonden reeds tal van verschillende evenementen plaats, zoals The BBC Proms, Last Night of the Proms, de Royal Variety Performance en spectaculaire shows zoals Lord of the Rings met een live orkest."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/68.jpg","credit":"Diliff · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Royal_Albert_Hall,_London_-_Nov_2012.jpg"}},{"id":69,"name":"Kensington Gardens","district":"Westminster","cats":["see"],"page":62,"lat":51.5073,"lon":-0.179,"url":null,"text":["Het volgende park is Kensington Gardens, een van de vier prachtige koninklijke parken in het centrum van Londen. De tuinen maakten vroeger deel uit van het Kensington Palace en waren hierdoor privé-eigendom. Vandaag is het een oase van rust in het midden van een drukke stad.","Het park hangt samen met Hyde Park en wordt gescheiden door Serpentine Lake en The Long Water Lake. Het park werd aangelegd in 1536 door Koning Henry VIII als jachtgebied, samen met Hyde Park. In 1728 werd het op verzoek van de Koningin gescheiden van Hyde Park. In 1841 werd het geopend voor het publiek.","Het park is gratis toegankelijk en bevat enkele leuke bezienswaardigheden, zoals het Peter Pan Standbeeld, Serpentine Gallery en Albert Memorial. Het park is een leuke plaats voor activiteiten zoals picknicken, wandelen, joggen, fietsen en gewoon genieten van de stilte. Er zijn cafés in de buurt en ook kiosken waar je een heerlijke koffie kan kopen."],"shop":[],"links":[],"top":false,"fixed":true,"photo":{"src":"photos/69.jpg","credit":"Iridescenti · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Kensington_Palace_from_across_Long_Water.JPG"}},{"id":70,"name":"Albert Memorial","district":"Westminster","cats":["see"],"page":62,"lat":51.502408,"lon":-0.177771,"url":null,"text":["Aan de rand van Kensington Gardens, rechtover de Royal Albert Hall, werd het Albert Memorial gebouwd ter nagedachtenis van Prins Albert, de man van Koningin Victoria. Het monument werd in 1872 geopend, 11 jaar na de dood van Prins Albert.","Het monument werd ontworpen door Sir George Gilbert Scott. Het heeft de vorm van een sierlijk paviljoen van zo’n 54 meter hoog met een standbeeld van de prins binnenin."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/70.jpg","credit":"Diliff · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Albert_Memorial,_London_-_May_2008.jpg"}},{"id":71,"name":"Serpentine Galleries","district":"Westminster","cats":["see"],"page":62,"lat":51.504853,"lon":-0.174947,"url":null,"text":["Kensington Gardens bevat een van de twee Serpentine Galleries, de andere is gevestigd net over The Serpentine in Hyde Park. De galerieën bevatten hedendaagse kunst. De tentoonstellingen en programma’s trekken veel bezoekers, ook omdat toegang tot deze galerieën gratis is."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/71.jpg","credit":"Mark Ahsmann · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:20110606_London_96.JPG"}},{"id":72,"name":"Kensington Palace","district":"Westminster","cats":["see"],"page":63,"lat":51.505156,"lon":-0.187759,"url":"https://hrp.org.uk/kensington-palace","text":["Kensington Gardens waren vroeger de privétuinen van Kensington Palace. Het paleis werd gebouwd in de 17e eeuw en diende als residentie voor de Britse koninklijke familie. Tijdens de Tweede Wereldoorlog liep het paleis beschadegingen op, dit omwille van een brandbom tijdens de Blitz. Reparaties werden uitgevoerd, al namen deze enkele jaren in beslag. Ondanks de reparaties, raakte het paleis toch in verval. Intussen vonden er reeds verschillende renovaties plaats in het paleis.","Het paleis bestaat uit verschillende woningen en appartementen. Hierdoor kunnen er verschillende gezinnen wonen, net als hun personeel. Tot de dag van vandaag wonen er nog steeds leden van de koniklijke familie in het paleis. Zo is het de officiële woonst van onder andere de Prins en Prinses van Wales en hun kinderen. Enkele ruimtes van het paleis zijn geopend voor het publiek, enkel de kantoren en privé-woonvertrekken kunnen niet bezocht worden."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/72.jpg","credit":"Colin Smith · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Kensington_Palace,_the_South_Front_-_geograph.org.uk_-_287402.jpg"}},{"id":73,"name":"Statue of Queen Victoria","district":"Westminster","cats":["see"],"page":64,"lat":51.505482,"lon":-0.186045,"url":null,"text":["Vlak aan Kensington Palace staat het Standbeeld van Koningin Victoria. Het standbeeld werd opgericht in 1893 en is gemaakt van wit marmer. Het standbeeld toont Koningin Victoria als 18-jarige koningin zittend in haar kroningsgewaad. Het beeld werd gemaakt ter ere van het gouden jubileum van de koningin in 1887.","Het beeld liep beschadegingen op tijdens de bombardementen van de Tweede Wereldoorlog. De neus van het beeld werd verwijderd, dit omwille van granaatscherven. Deze werd vervangen voor de troonsbestijging van Koningin Elizabeth II in 1952. In 2002 werd de neus nogmaals vervangen voor het gouden jubileum van Koningin Elizabeth II."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/73.jpg","credit":"Images George Rex from London, England · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Queen_Victoria_Statue_(48636218137).jpg"}},{"id":74,"name":"Peter Pan Statue","district":"Westminster","cats":["see"],"page":64,"lat":51.508668,"lon":-0.175941,"url":null,"text":["In het noorden van Kensington Gardens vind je het Peter Pan Standbeeld. Het bronzen beeld werd gemaakt in 1912 en staat vlakbij The Long Water. Het standbeeld staat dichtbij de voormalige woonst van J.M. Barrie. De tuinen waren een bron van inspiratie voor de verhalen van J.M. Barrie. Het standbeeld is geplaatst op de plek waar Peter Pan belandt in The Little White Bird uit 1902.","Het beeld is zo’n 4,3 meter hoog. Bovenop staat er een jongetje, Peter Pan, met een muziekinstrument in de hand. Verschillende kleine figuren staan op de zijkant van het standbeeld, figuren zoals eekhoorn, konijnen, feeën en muizen."],"shop":[],"links":[{"label":"Koop een toegangsticket voor Kensington Palace en leer meer over de","url":"https://www.getyourguide.nl/londen-l57/kensington-palace-90-minuten-sightseeingtour-t21251/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"photo":{"src":"photos/74.jpg","credit":"Peter Clarke · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Peter_Pan_monument.jpg"}},{"id":75,"name":"Sherlock Holmes Museum","district":"Westminster","cats":["see"],"page":65,"lat":51.5238,"lon":-0.1585,"url":"https://sherlock-holmes.co.uk/","text":["Literaire fans kunnen terecht in het Sherlock Holmes Museum dat gewijd is aan het fictieve personage Sherlock Holmes. Het museum werd geopend in 1990 en ligt aan Baker Street, met nummer 221B, zoals in het boek. Het huis ligt eigenlijk tussen de nummers 237 en 241, maar de City of Westminster gaf de officiële toestemming om het huis nummer 221B te geven. Het museum bevat verschillende artefacten en items uit de verschillende boeken, series en verfilmingen van Sherlock Holmes."],"shop":[],"links":[],"top":false,"fixed":true,"photo":{"src":"photos/75.jpg","credit":"Jordan 1972 (talk) · Public domain","page":"https://commons.wikimedia.org/wiki/File:221B_Baker_Street,_London_-_Sherlock_Holmes_Museum.jpg"}},{"id":76,"name":"Madame Tussauds","district":"Westminster","cats":["see"],"page":66,"lat":51.523045,"lon":-0.154359,"url":"https://www.madametussauds.com/london/","text":["Een van de meest populaire bezienswaardigheden in Londen is Madame Tussauds. Het wassenbeeldmuseum ligt vlakbij het Sherlock Holmes Museum en is populair omwille van de wassenbeelden van beroemdheden.","In 1835 werd het museum opgericht in Londen door Franse wassenbeeldenkunsternares Marie Tussaud. De Chamber of Horrors was een van de eerste attracties in het museum. Het museum","verhuisde in 1884 naar een nieuwe locatie, aangezien het eerder in Baker Street gevestigd was. De nieuwe locatie is waar het huidige museum gevestigd is.","Het museum heeft verschillende thema’s die allen per zone ingedeeld zijn. Zo is er Film&TV, Muziek, Royalty, Marvel, Star Wars, Sport en Historische Figuren. Er zijn ook enkele speciale attracties zoals Spirit Ride of Londen, Chamber of Horrors en een 4D Cinema.","Er zijn verschillende fotopunten en op het einde is er een souvenirwinkel. De wassenbeelden worden regelmatig bewerkt en er worden ook af en toe nieuwe toegevoegd. Hierdoor blijft het museum actueel en indrukwekkend."],"shop":[],"links":[{"label":"Boek je toegangsticket voor Madame Tussauds en ontdek de wassenbeelden","url":"https://www.getyourguide.nl/londen-l57/londen-madame-tussauds-londen-t174429/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"photo":{"src":"photos/76.jpg","credit":"self-made · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:WaxMuseumMadameTussaudsLondon.JPG"}},{"id":77,"name":"West End","district":"Westminster","cats":["see"],"page":67,"lat":51.5113,"lon":-0.1318,"url":null,"text":["West End is een zeer populaire regio binnen het district van Westminster. Het is vooral gekend door de vele theaters, shops en het uitgaansleven. Deze wijk wordt dan ook vaak vergeleken met Broadway in New York, maar dan wel in Londense stijl.","Het is een culturele en commerciële regio met veel verschillende shops, waaronder ook luxewinkels en boetieks. In deze regio ligt Oxford Street ook, de populairste winkelstraat in Europa. Verder zijn in deze regio ook heel wat historische pleinen, monumenten en musea te vinden.","Toch is deze regio het bekendst omwille van de theaters en musicals. West End bevat ongeveer 40 theaters waar zowel bekende als onbekende producties worden opgevoerd. De populairste theaters zijn Lyceum Theatre, Palace Theatre, Apollo Theatre, Victoria Palace Theatre, His Majesty’s Theatre en nog vele andere. Zeer gekende producties zijn onder andere Hamilton, The Lion King, Phantom of the Opera, The Book of Mormon, Wicked en Les Misérables."],"shop":[],"links":[],"top":false,"fixed":true,"photo":{"src":"photos/77.jpg","credit":"Jenny Wren 64 · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Map_of_the_West_End_of_London.png"}},{"id":78,"name":"Oxford Street","district":"Westminster","cats":["see","shop"],"page":67,"lat":51.515323,"lon":-0.14201,"url":null,"text":["Een van de bekendste winkelstraten van Europa ligt in Londen, namelijk Oxford Street. De straat ligt in het hart van Londen en is bijna 2 kilometer lang. Er zijn veel verschillende winkels te vinden, zoals grote warenhuizen, modewinkels, toeristische winkels, cafés, bars en tal van andere winkels. De straat is ook zeer charmant en gezellig rond de feestdagen."],"shop":["Zoals eerder gezegd is Oxford Street een van de bekendste winkelstraten van Europa. De straat is zo’n 2 kilometer lang en bevat veel verschillende winkels, zoals grote warenhuizen, modewinkels, toeristische winkels, cafés, bars en tal van andere winkels. De straat is ook zeer charmant en gezellig rond de feestdagen.","Wees voorbereid op drukte, dit aangezien het de grootste winkelstraat van London is. Er zijn tal van toeristen, maar gelukkig ook ongelooflijk veel shops. Reken hier voldoende tijd voor in je reisschema.","Er zijn veel Souvenirshops te vinden op Oxford Street. Deze winkels bevatten importproducten uit de Verenigde Staten, alsook typische souvenirs, zoals truien, shirts, tassen, sleutelhangers en tal van andere producten. Indien je opzoek bent naar typische souvenirs, zijn deze shops een kijkje waard."],"links":[{"label":"Geniet van een workshop tijdens je reis naar London en leer hoe je","url":"https://www.getyourguide.nl/londen-l57/londen-traditionele-engelse-scone-maken-en-thee-workshop-t826151/?partner_id=W38F18N&cmp=citygids_london"}],"top":false,"photo":{"src":"photos/78.jpg","credit":"Oast House Archive · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Oxford_Street_(geograph_4949395).jpg"}},{"id":79,"name":"Piccadilly Circus","district":"Westminster","cats":["see"],"page":68,"lat":51.510201,"lon":-0.134169,"url":null,"text":["Een van de meest iconische pleinen in Londen is Piccadilly Circus. Het wordt vaak vergeleken met Times Square in New York omwille van de neonreclames. Op het plein staat ook een standbeeld van Anteros.","In 1908 kwam er het eerste verlichte reclamebord op Piccadilly Circus, een reclame van Perrier. De eerste borden werden verlicht met behulp van gloeilampen, deze werden later vervangen. In 1998 werden er digitale projectors gebruikt voor een Coca-Cola reclame. In de jaren 200 werd er overgestapt naar LED-schermen en nadien kwamen er in 2011 neonlampen.","Het beeld van Anteros wordt vaak verward met Eros, de broer van Anteros. Het beeld kreeg de naam ‘De Engel van de Christelijke Naastenliefde’. Anteros is namelijk de god van de beantwoorde liefde. Het beeld staat bovenop Shaftesbury Memorial Fountain, een eerbetoon aan Lord Shaftesbury, een politicus, filantroop en sociaal hervormer uit de 19e eeuw.","Rondom Piccadilly Circus zijn nog verschillende interessante gebouwen en indrukwekkende monumenten waardoor een bezoekje aan Piccadilly Circus een must is."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/79.jpg","credit":"Jimmy Baikovicius · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Open_Happiness_Piccadilly_Circus_Blue-Pink_Hour_120917-1126-jikatu.jpg"}},{"id":80,"name":"Leicester Square","district":"Westminster","cats":["see"],"page":68,"lat":51.510447,"lon":-0.130062,"url":null,"text":["Leicester Square is een ander levendig en populair plein in het centrum van Londen. Het plein is volledig autovrij en wordt omringd door populaire winkels, bioscopen, theaters en straatartiesten. Het park werd aangelegd in 1670 en groeide in de 19e en 20e eeuw uit tot een culturele plaats in Londen. In 2012 werd het opnieuw aangelegd met bestrating, beelden en fonteinen.","Het plein bevat verschillende standbeelden, zoals van William Shakespeare, Paddington Beat Statue, Charlie Chaplin Statue, Mr. Bean Statue, Mary Poppins Statue, Gene Kelly Statue, Laurel and Hardy Statue, Harry Potter Statue en nog meer.","Enkele bekende shops aan het plein is M&M’s London en The Lego Store London. Er zijn verschillende bioscopen in de regio, waaronder ODEON Luxe Leicester Square, Vue Cinema, Cineworld IMAX en Prince Charles Cinema. Er zijn ook verschillende theaters in de buurt, net als verschillende bars en restaurants. Als de Aziatische keuken jouw ding is, dan is het nabijgelegen Chinatown perfect voor een hapje."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/80.jpg","credit":"APK · CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:Leicester_Square_-_May_2026.jpg"}},{"id":81,"name":"Chinatown","district":"Westminster","cats":["see"],"page":69,"lat":51.512013,"lon":-0.131002,"url":"https://chinatown.co.uk","text":["Als de Aziatische cultuur, tradities en Aziatisch eten jouw ding is, dan is Chinatown de perfecte plaats om te ontdekken. Het vond oorspronkelijk plaats in East London,","maar verhuisde na de Tweede Wereldoorlog naar West End. Vanaf 1970 groeide de wijk uit tot de prachtige plaats dat je vandaag kan bezoeken.","Het is een kleurrijke wijk vol met traditionele en culturele elementen zoals lantaars en boogpoorten. Je kan er ook een lekkere maaltijd verkrijgen, zoals Vietnamees, Chinees, Japans, Koreaans of Thais. Er vinden ook evenementen plaats, zoals Chinees Nieuwsjaar."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/81.jpg","credit":"Dietmar Rabich · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:London,_China_Town_--_2016_--_4868.jpg"}},{"id":82,"name":"National Gallery","district":"Westminster","cats":["see"],"page":69,"lat":51.50901,"lon":-0.128347,"url":"https://nationalgallery.org.uk","text":["West End heeft ook de optie om kunst te ontdekken. Zo is er de National Gallery, een indrukwekkend kunstmuseum en het ligt vlakbij Leicester Square en Trafalgar Square. Het museum werd opgericht in 1824 na de aankoop van 38 schilderijen en is uitgegroeid tot een van de grootste en meest diverse schilderijencollecties ter wereld.","In totaal zijn er zo’n 2300 schilderijen te vinden van de 13e eeuw tot de 20e eeuw. Enkele schilders die hier werken hebben hangen zijn Leonardo da Vinci, Vincent van Gogh, Claude Monet, Rembrandt, Vermeer en nog vele andere. Er zijn verschillende evenementen in het museum, zoals conventies, tijdelijke tentoonstellingen en tours. Er is ook een souvenirshop en een café aanwezig in het museum."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/82.jpg","credit":"Diego Delso · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Galer%C3%ADa_Nacional,_Londres,_Inglaterra,_2014-08-07,_DD_036.JPG"}},{"id":83,"name":"National Portrait Gallery","district":"Westminster","cats":["see"],"page":69,"lat":51.509556,"lon":-0.128121,"url":"https://npg.org.uk","text":["Vlak achter de National Gallery vind je de National Portrait Gallery. Dit is een uniek museum en bevat verschillende portretschilderijen van bekende Britten. Dit kunnen schilderijen zijn van koningen, koninginnen, auteurs, wetenschappers, artiesten en andere beroemdheden.","Binnenin zijn er meer dan 220.000 portretten te vinden, dit kan gaan van schilderijen tot beeldhouwwerken en andere vormen van kunst. Het werd opgericht in 1856 en was het eerste portretmuseum ter wereld. In 2023 werd het museum vernieuwd en heropend. Er zijn zowel vaste tentoonstellingen als tijdelijke tentoonstellingen."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/83.jpg","credit":"Department for Digital, Culture, Media and Sport · Public domain","page":"https://commons.wikimedia.org/wiki/File:NPG_UK_logo.svg"}},{"id":84,"name":"Trafalgar Square","district":"Westminster","cats":["see"],"page":70,"lat":51.508144,"lon":-0.128031,"url":null,"text":["Een ander bekend plein in Londen is Trafalgar Square. Het is een historisch plein in West End en wordt omringd door verschillende interessante gebouwen, beelden en fonteinen.","Het plein werd aangelegd om de Britse overwinning bij de Slag van Trafalgar te eren. Midden op het plein staat een zuil, Nelson’s Column. Deze is zo’n 52 meter hoog en bovenop de zuil staat een beeld van Admiraal Horatio Nelson, deze stierf tijdens de Slag van Trafalgar. Het plein bevat ook vier bronzen leeuwen en twee grote fonteinen.","Het plein is de locatie voor verschillende evenementen, zoals festivals, demonstraties en rond de feestdagen is de versiering ook indrukwekkend. Er zijn verschillende bezienswaardigheden in de regio, zoals verschillende musea en andere historische pleinen."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/84.jpg","credit":"Diliff · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Trafalgar_Square,_London_2_-_Jun_2009.jpg"}},{"id":85,"name":"St Paul’s, The Actor’s Church","district":"Westminster","cats":["see"],"page":70,"lat":51.5128,"lon":-0.1236,"url":null,"text":["Pal in het midden van Covent Garden ligt St Paul’s, the Actor’s Church, een Anglicaanse kerk. De kerk is verbonden aan het Britse toneel en theater, daarom dat de bijnaam ‘Actor’s Church’ is. Sinds de 17e eeuw is het een ontmoetingsplaats voor acteurs, artiesten en theatermakers. Het ligt dan ook dichtbij verschillende theaters. De kerk bevat verschillende herdenkingspanelen van beroemde mensen, zoals van Charlie Chaplin. De kerk wordt dan ook gebruikt voor herdenkingsdiensten en speciale optredens door acteurs."],"shop":[],"links":[{"label":"Geniet van een boottochtje op de Theems van Westminster naar de Tower","url":"https://www.getyourguide.nl/londen-l57/londen-rondvaart-van-westminster-naar-st-katharine-t71499/?"}],"top":false,"fixed":true,"photo":{"src":"photos/85.jpg","credit":"Matt Brown · CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:St_Paul%27s_Covent_Garden.jpg"}},{"id":86,"name":"Somerset House","district":"Westminster","cats":["see"],"page":71,"lat":51.5117,"lon":-0.116976,"url":null,"text":["Het ontdekken van de City of London begint bij het Somerset House, een neoklassiek gebouw uit de 18e eeuw. Oorspronkelijk stond er een ander prachtig paleis, Somerset Place. Dit raakte in verval en het werd afgebroken met als doel er een nieuw gebouw te zetten: Somerset House. Het werd gebouwd om te gebruiken als overheidsgebouw waar administratie, macht en wetenschap centraal stonden. Zo vonden er de Royal Society, Royal Academy of Arts en General Register Office plaats.","Bridge.","Vandaag wordt het gebouw gebruikt voor tentoonstellingen, evenementen en installaties van kunst, design, film en muziek. Seizoensgebonden evenementen zoals een ijsschaatsbaan in de winter en openluchtoptredens tijdens de zomer worden hier ook georganiseerd. Er zijn ook nog cafés en restaurants te vinden en verschillende winkels en boekhandels."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/86.jpg","credit":"Anthony O'Neil · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:The_courtyard_of_Somerset_House,_Strand,_London_-_geograph.org.uk_-_1601172.jpg"}},{"id":87,"name":"Royal Opera House","district":"Westminster","cats":["see"],"page":71,"lat":51.512922,"lon":-0.122135,"url":"https://www.roh.org.uk","text":["Een van de bekendste operahuizen ter wereld staat in Londen, vlakbij Covent Garden. Het Royal Opera House werd oorspronkelijk gebouwd in 1732, maar de huidige constructie dateert uit 1858. Het is een plaats van creativiteit en kunst, je kan er terecht voor opera, ballet en klassieke concerten.","Er worden klassieke opera’s gehouden, zoals Mozart en Puccini. Maar er zijn ook moderne opera’s te zien. The Royal Ballet geeft hier ook optredens, klassiekers zoals Het Zwanenmeer. Maar ook moderne optredens worden hier gehouden. Hetzelfde met concerten, er worden zowel klassieke concerten gehouden, als jazz- en filmconcerten.","Het gebouw heeft ook al een hele geschiedenis achter de rug. Het huidige gebouw is het derde gebouw, dit nadat de eerste gebouwen afgebrand waren, dit in 1808 en 1856. Enkel de voorgevel, foyer en het auditorium dateren uit 1958. Alle andere onderdelen van het complex dateren uit de jaren ’90. De hoofdzaal kan zo’n 2256 mensen een plaatsje aanbieden."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/87.jpg","credit":"Russ London (talk) · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Royal_Opera_House_and_ballerina.jpg"}},{"id":88,"name":"London Transport Museum","district":"Westminster","cats":["see"],"page":71,"lat":51.511974,"lon":-0.121432,"url":"https://www.ltmuseum.co.uk","text":["Indien je meer wil leren over transport, dan is het London Transport Museum een goede plaats om te ontdekken. In het museum kom je de geschiedenis te weten van het transport in Londen, dit vanaf de eerste paardentram tot de beroemde Underground.","Het museum toont niet alleen de geschiedenis, je kan er ook verschillende oude trams, metro’s en voertuigen bezichtigen. Er vinden ook workshops plaats, verschillende activiteiten en themadagen. Er is een souvenirwinkel en een restaurant."],"shop":[],"links":[],"top":false},{"id":89,"name":"Royal Courts of Justice","district":"Westminster","cats":["see"],"page":72,"lat":51.513706,"lon":-0.113186,"url":"https://theroyalcourtsofjustice.com","text":["Het belangrijkste gerechtsgebouw in Londen is de Royal Courts of Justice. Het is een imposant gotisch gebouw waar civiele rechtszaken worden behandeld. Zaken van het Hooggerechtshof (High Court) en Court of Appeal komen hier terecht. Het gebouw dateert uit 1882 en bevat meer dan 1000 kamers. Je kan gratis het gebouw binnen en er zijn ook rondleidingen beschikbaar. Je kan ook openbare rechtszittingen bijwonen, er zijn wel strenge veiligheidscontroles bij binnenkomst."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/89.jpg","credit":"This image was produced by me, David Castor (user:dcastor). The pictures I submi · CC0","page":"https://commons.wikimedia.org/wiki/File:Royal_Courts_of_Justice_2019.jpg"}},{"id":90,"name":"Leadenhall Market","district":"City of London","cats":["shop"],"page":74,"lat":51.512811,"lon":-0.083523,"url":"https://leadenhallmarket.co.uk/","text":["De City of London bevat ook Leadenhall Market. Het is een leuke plaats om te winkelen en eten, maar het is ook een leuke bezienswaardigheid. De markt werd onder andere gebruikt in Harry Potter als de ingang van Diagon Alley. Je vindt er luxewinkels, modewinkels, cadeauwinkels en boekenwinkels. Er zijn ook tal van restaurants, bars en cafés."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/90.jpg","credit":"Diliff · CC BY 2.5","page":"https://commons.wikimedia.org/wiki/File:Leadenhall_Market_In_London_-_Feb_2006_rotated.jpg"}},{"id":91,"name":"Selfridges, Oxford Street","district":"Westminster","cats":["shop"],"page":75,"lat":51.51461,"lon":-0.152734,"url":null,"text":["Het warenhuis Selfridges kan je bijna vergelijken met Harrods, maar is minder luxueus. Het werd opgericht in 1909 en is na Harrods het grootste warenhuis van het Verenigd Koninkrijk. Er is een luxe-afdeling, maar ook andere afdelingen, zoals boeken, schoenen, comsetica, woonaccessoires en minder luxueuze kledij kan je vinden in dit warenhuis. Tijdens de feestdagen is er een hele afdeling dat enkel gewijd is aan Kerstmis."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/91.jpg","credit":"Steve Daniels · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Selfridges_on_Oxford_Street_-_geograph.org.uk_-_2190127.jpg"}},{"id":92,"name":"Disney Store, Oxford Street","district":"Westminster","cats":["shop"],"page":76,"lat":51.515323,"lon":-0.148314,"url":null,"text":["Oxford Street bevat de grootste Disney Store van Europa. Het is een prachtige locatie en heeft drie verdiepingen. De magie begint al voor je de winkel binnenstapt dankzij de indrukwekkende versiering aan het gebouw. Er zijn verschillende afdelingen, gebaseerd op de films en verhalen. Zo heb je een disneyprinsessen afdeling en een afdeling voor Marvel en Star Wars."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/92.jpg","credit":"Oast House Archive · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Oxford_Street_(geograph_4949395).jpg"}},{"id":93,"name":"Whittard of Chelsea, Oxford Street","district":"Westminster","cats":["shop"],"page":76,"lat":51.516159,"lon":-0.132522,"url":null,"text":["Als je op reis gaat naar Engeland, moet je natuurlijk ook genieten van een kopje thee. Een van de bekendste theewinkels is Whittard of Chelsea. De winkel staat bekend omwille van de kwalitatieve thee, chocomelk en koffie. Er zijn meer dan 100 soorten thee te vinden, ook andere producten zoals theeservies, mokken, koffiezetapparaten kan je verkrijgen in deze shops."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/93.jpg","credit":"Mtaylor848 · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Whittard,_Lands_Lane,_Leeds_(11th_April_2011).jpg"}},{"id":94,"name":"Regent Street","district":"Westminster","cats":["shop"],"page":78,"lat":51.513079,"lon":-0.140522,"url":null,"text":["Regent Street loopt vanaf Piccadilly Circus tot net voorbij Oxford Street. Deze straat bevat verschillende leuke winkels en aangezien het uitkomt op Oxford Street, is het de perfecte locatie om te gaan winkelen. Hieronder bespreken we enkele interessante shops die je zeker moet bezoeken."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/94.jpg","credit":"aurélien. · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Regent_Street_2011-04-25.jpg"}},{"id":95,"name":"Hamleys, Regent Street","district":"Westminster","cats":["shop"],"page":78,"lat":51.512915,"lon":-0.140104,"url":null,"text":["De oudste speelgoedwinkel ter wereld kan je vinden in Regent Street. Hamleys is een echt paradijs voor jong en oud. De winkel werd opgericht in 1760 en het heeft een enorm assortiment dat over verschillende verdiepingen staat verspreid. Er vinden dagelijks demonstraties plaats en er worden zelfs meet&greets georganiseerd met personages, zoals LEGO, Barbie of Marvel."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/95.jpg","credit":"AwH108 · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Hamleys_logo.png"}},{"id":96,"name":"Liberty","district":"Westminster","cats":["shop"],"page":78,"lat":51.513961,"lon":-0.140007,"url":null,"text":["In een zijstraat van Regent Street kan je nog een iconisch warenhuis vinden, namelijk Liberty. Ook hier kan je luxeproducten vinden, net als design, cosmetica, interieur en kunst. Het werd gebouwd in 1924 in Tudorstijl, waardoor het een indrukwekkend gebouw is."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/96.jpg","credit":"Luis Villa del Campo · CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Liberty_department_store_London.jpg"}},{"id":97,"name":"Bond Street","district":"Westminster","cats":["shop"],"page":80,"lat":51.512095,"lon":-0.144206,"url":null,"text":["Bond Street is ook een populaire locatie om te shoppen. Hier bevinden zich verschillende luxe winkels, zoals Louis Vuitton, Chanel, Hermès en Dior. Het is een exclusieve winkelstraat in het hart van Londen. Als je dus opzoekt met naar high-end mode, sieraden en kunst, dan is Bond Street de perfecte locatie."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/97.jpg","credit":"Wikimedia Commons · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Old_Bond_Street_2_db.jpg"}},{"id":98,"name":"Sotheby’s, Bond Street","district":"Westminster","cats":["shop"],"page":80,"lat":51.511834,"lon":-0.143792,"url":null,"text":["Bond Street bevat niet enkel luxueuze merkwinkels, zo is er ook een veilinghuis, Sotheby’s. Dit is een van de oudste veilinghuizen ter wereld, en ook een van de meest prestigieuze. De locatie is perfect, aangezien dit echt een luxueuze straat is. Het werd opgericht in 1744 en het organiseert veilingen voor kunst, juwelen, horloges, zeldzame boeken, wijn, whisky, antiek, meubels, mode en nog tal van andere zaken.","Soms zijn er gratis tentoonstellingen te bezichtigen en er is ook een koffiebar aanwezig in het gebouw. Verder worden er ook exclusieve evenementen gehouden, zoals lezingen, galadiners en VIP-evenementen."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/98.jpg","credit":"ajay_suresh · Public domain","page":"https://commons.wikimedia.org/wiki/File:Sotheby%27s_(51921999492).jpg"}},{"id":99,"name":"Carnaby Street","district":"Westminster","cats":["shop"],"page":82,"lat":51.513335,"lon":-0.13883,"url":null,"text":["Een andere leuke locatie met leuke shops is Carnaby Street. Deze straat is bekend omwille van de mode en muziek. Er zijn veel unieke boetieks en shops te vinden, net als gezellige cafés. De straat bevat iets alternatievere shops dan wat je zal vinden op Oxfort Street, Regent Street of Bond Street. Deze straat loopt parallel aan Regent Street."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/99.jpg","credit":"The National Archives UK · No restrictions","page":"https://commons.wikimedia.org/wiki/File:Londons_Carnaby_Street,_1966.jpg"}},{"id":100,"name":"Covent Garden","district":"Westminster","cats":["shop"],"page":82,"lat":51.511634,"lon":-0.124213,"url":"https://coventgardenlondonuk.com","text":["Eerder hebben we Covent Garden ook al vermeld. Dezr regio bevat alsook tal van winkels en shops waardoor het een geweldige locatie is op te bezoeken. De regio is vooral gekend voor het historische marktgebouw. Vandaag is het een gezellig winkelcentrum, de straten rondom het gebouw bevatten ook vele winkels, waardoor het een ideale plaats is voor toeristen."],"shop":[],"links":[],"top":true,"photo":{"src":"photos/100.jpg","credit":"Covent_Garden_Interior_May_2006.jpg: Diliff\nderivative work: SilkTork (talk) · CC BY 2.5","page":"https://commons.wikimedia.org/wiki/File:Covent_Garden_Interior_May_2006_crop.jpg"}},{"id":101,"name":"St. James’s Street","district":"Westminster","cats":["shop"],"page":82,"lat":51.506617,"lon":-0.139314,"url":null,"text":["Ook St-James’s Street is bekend, dit omwille de eeuwenoude clubs, exclusieve winkels, klassieke herenmodezaken en connecties met het koningshuis. De straat komt uit St. James’s Palace, een huis dat officieel hoort bij het koningshuis en gebruikt wordt voor officiële zaken."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/101.jpg","credit":"Stephen Craven · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Saint_James%E2%80%99s_Street_-_geograph.org.uk_-_3748059.jpg"}},{"id":102,"name":"Berry Bros. & Rudd","district":"Westminster","cats":["shop"],"page":82,"lat":51.505496,"lon":-0.138041,"url":null,"text":["Een luxe en prestigieuze wijn- en sterke drankhandelaar in deze straat is Berry Bros. & Rudd. Deze winkel gaat terug tot 1698 en is de perfecte locatie als je houdt van wijn, whisky en andere sterke dranken. Er zijn meer dan 4000 wijnen te vinden van over de hele wereld. De winkel is ook gespecialiseerd in single malt whisky’s."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/102.jpg","credit":"Berry Bros. & Rudd · CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Berry_Bros._%26_Rudd.png"}},{"id":103,"name":"Lock & Co. Hatters","district":"Westminster","cats":["shop"],"page":83,"lat":51.505725,"lon":-0.138282,"url":null,"text":["Vlakbij Berry Bros. & Rudd, ligt een andere exclusieve winkel, Lock & Co. Hatters. Dit is de oudste hoedenwinkel ter wereld en is al sinds 1676 gevestigd in St.James’s Street. In de shop vind je tal van verschillende types hoeden. En omwille van de kwaliteit en vakmanschap zijn er ook vele beroemde klanten."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/103.jpg","credit":"Unknown authorUnknown author · Public domain","page":"https://commons.wikimedia.org/wiki/File:Lock_%26_Co._Hatters_logo.jpg"}},{"id":104,"name":"John Lobb Bootmaker","district":"Westminster","cats":["shop"],"page":83,"lat":51.505881,"lon":-0.138418,"url":null,"text":["St.James’s Street is ook de locatie van een van de meest prestigieuze schoenmakers ter wereld, John Lobb Bootmaker. Het bedrijf werd door John Lobb opgericht in 1866. Deze shop is bekend omwille van op maat gemaakte schoenen, volledig handgemaakt. De klanten bestaan vooral uit royalty, beroemdheden, aristocraten en kenners van kwaliteitsschoenen."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/104.jpg","credit":"Hayden Soloviev · CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:John_Lobb,_9_St_James%27s_St,_London.png"}},{"id":105,"name":"Jermyn Street","district":"Westminster","cats":["shop"],"page":85,"lat":51.508671,"lon":-0.13649,"url":null,"text":["Ook Jermyn Street is een bekende straat als het aankomt op luxe merken. Deze ligt vlakbij in St. James’s Street en is vooral bekend omwille van de herenmode. Hier zijn verschillende winkels waar je kwaliteitskledij kan kopen. Deze straat is sinds de 17e eeuw het centrum van herenmode in Londen."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/105.jpg","credit":"Brian Harrington Spier from Shanghai, China · CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Diamond_Jubilee-_3rd_June_2012_(7541400768).jpg"}},{"id":106,"name":"Piccadilly Street","district":"Westminster","cats":["shop"],"page":85,"lat":51.506885,"lon":-0.142907,"url":null,"text":["Piccadilly Street ligt vlak aan Piccadilly Circus en bevat tal van bekende shops. Dit is de locatie van een van de vele Hard Rock Cafés in Londen. Een winkel bekend omwille van de shirts, truien en natuurlijk het restaurant.","Een van de grotere Waterstones ligt ook aan Piccadilly. Dit is de droomwinkel voor boekliefhebbers. Deze Waterstones heeft ook een koffieshop en doorheen de winkel zijn verschillende sofa’s waar je rustig kan zitten en lezen.","Ook een van de oudste winkelgalerijen in Londen kan je hier vinden, namelijk Burlington Arcade. Hier vind je veel verschillende producten, van cosmetica, juwelen, schoenen en tal van andere artikelen."],"shop":[],"links":[],"top":false,"photo":{"src":"photos/106.jpg","credit":"Rept0n1x · CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:A4_Piccadilly_-_DSC04251.JPG"}}],"lodging":{"Camden":[{"type":"Appartement","name":"Camden Town Apartments"},{"type":"Hotel","name":"Pullman London St Pancras"},{"type":"Hostel","name":"Generator London"}],"City of London":[{"type":"Hotel","name":"Clayton Hotel London Wall"},{"type":"Hostel","name":"YHA London St Paul’s"},{"type":"Appartement","name":"Marlin Apartments London City"}],"Tower Hamlets":[{"type":"Appartement","name":"Delightful Tower Bridge Apartment"},{"type":"Hotel","name":"The Tower Hotel"},{"type":"Hostel","name":"Wombats City Hostel London"}],"Southwark":[{"type":"Appartement","name":"Marlin Apartments London Bridge"},{"type":"Hotel","name":"Hotel London Tower Bridge"},{"type":"Hostel","name":"Dover Castle Hostel"}],"Lambeth":[{"type":"Hotel","name":"Park Plaza County Hall London"},{"type":"Appartement","name":"Staybridge Suites London"},{"type":"Hostel","name":"The Walrus Bar and Hostel"}],"Westminster":[{"type":"Hotel","name":"Montcalm Piccadilly Townhouse"},{"type":"Appartement","name":"Leicester Square Studios"},{"type":"Hostel","name":"Clink261 Hostel"}]},"facts":[{"title":"Inleiding","text":"3 Londen is een van de meest bekende steden in de wereld. Het is de hoofdstad van het Engeland en heeft een rijke geschiedenis en cultuur. Vandaag de dag is Londen een bruisende wereldstad die bekend is omwille van haar culturele diversiteit, internationale invloed en historische erfgoed. De stad bevat talloze attracties en bezienswaardigheden, waarvan er ook een groot aantal gratis toegankelijk zijn, zoals Tate Modern, National History Museum en het British Museum. De stad bevat voor ieder wat wils, zo vind je de geschiedenis terug in bezienswaardigheden zoals de Tower of Londen, Houses of Parliament en Westminster Abbey. Hou je van muziek en toneel? Dan kan je zeker terecht in West End waar wereldberoemde theaterproducties te zien zijn. Is shoppen meer jouw ding? Dan zijn er verschillende plaatsen waar je terecht kan om de perfecte koopjes te doen, zoals Oxford Street en Borough Market. Deze reisgids neemt je mee op een reis door Londen. Elk hoofdstuk is een nieuw district waar de verschillende bezienswaardigheden in uitgelegd worden. De districten volgen elkaar op op gebied van ligging, waardoor je deze reisgids in een logische volgorde kan meevolgen. Elk hoofdstuk bevat zowel bezienswaardigheden als overnachtingsmogelijkheden in de regio. Het avontuur begint in Camden, hier ligt het internationale station St Pancras, waar veel reizigers arriveren. Je kan hier de Eurostar of Thalys nemen richting Europa, maar je kan hier ook een trein nemen naar Heathrow Airport. Totale Afstand: 70 kilometer"},{"title":"Geschiedenis","text":["Londen heeft een rijke en veelzijdige geschiedenis die meer dan 2000 jaar beslaat. Het begon als","Londinium, een Romeinse stad gesticht in 43 na Christus, en groeide uit tot een belangrijk","commercieel en administratief centrum. Na de val van het Romeinse Rijk in de 5e eeuw, werd Londen","opnieuw bewoond door Angelsaksen en later door de Normandiërs na de Slag bij Hastings in 1066,","wat leidde tot de bouw van de Tower of London. In de Tudorperiode (16e eeuw) bloeide Londen als het","politieke en culturele centrum van Engeland, vooral onder koning Henry VIII en koningin Elizabeth","I.","De stad onderging grote veranderingen in de 17e eeuw, toen de Engelse Burgeroorlog en de Grote","Brand van Londen in 1666 de stad beïnvloedden, maar ook leidde tot een periode van heropbouw. In","de 18e en 19e eeuw, tijdens de industriële revolutie, groeide Londen uit tot een wereldcentrum van","handel, wetenschap en cultuur, met iconen zoals Big Ben en de Tower Bridge die de skyline sierden.","Londen speelde ook een cruciale rol tijdens de twee wereldoorlogen in de 20e eeuw, vooral tijdens de","Blitz van de Tweede Wereldoorlog, die de stad zwaar beschadigde. Na de oorlog werd Londen","herbouwd en groeide het verder uit tot een kosmopolitische en wereldberoemde stad. Tegenwoordig","is Londen een financieel en cultureel centrum, dat zijn historische verleden combineert met moderne","innovaties en een enorme diversiteit aan culturen."]},{"title":"Geografie","text":["Londen ligt in het zuidoosten van Engeland, langs de rivier de Theems, die door de stad slingert van","west naar oost. De stad bevat grote parken zoals Hyde Park en Regent’s Park. De Theems speelt een","belangrijke rol in de geografie van de stad, zowel voor transport als recreatie. Het klimaat is gematigd,","met milde winters en koele zomers."]},{"title":"Klimaat","text":["Het klimaat van Londen is gematigd, met milde winters en koele zomers. De temperaturen liggen in","de winter gemiddeld tussen de 2°C en 8°C, en in de zomer tussen de 15°C en 25°C, hoewel het soms","warmer kan zijn. Londen krijgt het hele jaar door matige neerslag, met regenval die redelijk","gelijkmatig is verspreid. Sneeuw komt zelden voor, maar kan af en toe in de wintermaanden vallen.","Het weer is vaak bewolkt en de stad heeft relatief weinig zon, vooral in de herfst en winter."]},{"title":"Populatie","text":["Londen heeft een diverse en dynamische populatie van ongeveer 9 miljoen mensen, wat het de","grootste stad van het Verenigd Koninkrijk maakt. Het is een van de meest multiculturele steden ter","wereld, met inwoners uit alle hoeken van de wereld. Ongeveer 37% van de Londense bevolking bestaat","uit mensen met een niet-Britse achtergrond. De stad trekt zowel jongeren als ouderen aan, met een","grote studentenpopulatie en veel internationale professionals. Londen is ook een belangrijke","bestemming voor migranten, wat bijdraagt aan de culturele en etnische diversiteit."]},{"title":"Reizen naar","text":["Londen is goed bereikbaar vanuit zowel binnen als buiten het Verenigd Koninkrijk. Je kunt er op","verschillende manieren naartoe reizen:","•","Vliegtuig: Londen heeft vijf internationale luchthavens, waaronder Heathrow, Gatwick,","Stansted, Luton en City Airport, die verbindingen bieden met steden wereldwijd.","•","Trein: Het treinverkeer naar Londen is uitstekend. Vanuit andere delen van Groot-Brittannië","komen hogesnelheidstreinen aan op London St Pancras, London Paddington, London Euston","en andere grote stations.","•","Auto: Londen is bereikbaar via het uitgebreide snelwegennet van het Verenigd Koninkrijk,","met verbindingen zoals de M1, M4, en M20.","•","Bus: Er zijn verschillende busmaatschappijen die verbindingen bieden naar Londen vanuit","heel Europa, zoals Eurolines en National Express."]},{"title":"Reizen in","text":["In Londen kun je je gemakkelijk verplaatsen met verschillende vormen van openbaar vervoer:","•","London Underground (Tube): Het uitgebreide metronetwerk is de snelste manier om door de","stad te reizen, met verbindingen naar de meeste belangrijke gebieden.","•","Bussen: De iconische rode bussen zijn een handige en goedkope manier om Londen te","verkennen, met uitgebreide routes door de stad.","•","Taxi's: Traditionele zwarte taxi's of Uber zijn beschikbaar voor korte ritten.","•","Fietsen: Je kan fietsen huren via Santander Cycles, het deelfietsensysteem van de stad.","•","Treinen: Voor reizen naar voorsteden of nabijgelegen steden zijn er verschillende","treinstations, zoals London Paddington en London Victoria.","•","Boot: De River Bus biedt een unieke manier van vervoer over de rivier de Theems.","Met een Oyster Card of contactloze betaling kun je gemakkelijk toegang krijgen tot het openbaar","vervoer in Londen."]},{"title":"Eten en Drinken","text":["Londen biedt een diverse en gevarieerde eetcultuur, met invloeden van over de hele wereld.","Traditioneel Britse gerechten zoals fish and chips, roast dinners en full English breakfasts zijn nog","steeds populair, maar de stad staat vooral bekend om haar multiculturele keuken. Je kan genieten van","Indiaas, Italiaans, Chinese, Arabisch, Caribisch en veel meer soorten eten. Er zijn talloze markten","zoals Borough Market waar je heerlijk streetfood kunt proeven. Bovendien biedt Londen een","bloeiende koffiecultuur en een breed scala aan bars, van traditionele pubs tot chique cocktailbars.","Veganistische en vegetarische opties zijn ook goed vertegenwoordigd in de stad."]},{"title":"Geld","text":["In Londen wordt de valuta van het Verenigd Koninkrijk gebruikt, namelijk de Britse pond (£), afgekort","als GBP (Great British Pound). Betaalmethoden zijn divers, en naast contant geld kun je veelvuldig","betalen met pinpassen, creditcards en contactloze betalingen (zoals Apple Pay en Google Pay). In","Londen zijn er ook veel geldautomaten (ATM's) waar je cash kunt opnemen. Veel winkels en","horecagelegenheden accepteren voornamelijk contactloze betalingen en creditcards, wat het","gemakkelijk maakt om zonder contant geld te reizen."]},{"title":"Internet en Telefoon","text":["In Londen is zowel internet als het telefoonnetwerk van hoge kwaliteit en goed ontwikkeld, met brede","dekking en snelle verbindingen.","Internet:","•","Wi-Fi: Er is veel gratis openbare Wi-Fi beschikbaar, vooral in cafés, restaurants, winkelcentra","en openbare ruimtes. Daarnaast biedt Transport for London (TfL) Wi-Fi aan op veel","ondergrondstation.","•","Mobiel internet: De meeste mobiele providers bieden goede 4G- en zelfs 5G-dekking in de","stad, dus toegang tot snel mobiel internet is geen probleem, zelfs in drukke gebieden.","Telefoonnetwerk:","•","Mobiele providers: Grote aanbieders zoals EE, Vodafone, O2 en Three bieden uitstekende","dekking in Londen, met zowel 4G als 5G beschikbaar in veel delen van de stad.","•","Prepaid en SIM-kaarten: Toeristen kunnen eenvoudig een prepaid SIM-kaart kopen bij","winkels of op luchthavens om goedkope belminuten, data en berichten te krijgen.","•","Telefoonnummers: Het landnummer voor het VK is +44, en telefoonnummers beginnen","meestal met 020 voor Londen.","In het algemeen is zowel internet als het telefoonnetwerk in Londen zeer betrouwbaar en goed","bereikbaar, wat het makkelijk maakt om verbonden te blijven, zowel voor locals als bezoekers."]},{"title":"Noodnummers","text":["In Londen, zoals in de rest van het Verenigd Koninkrijk, zijn er drie belangrijke noodnummers die je","in geval van een noodgeval kunt bellen:","1. 112 en 999 – Algemeen noodnummer","Dit nummer is voor alle soorten noodgevallen, zoals brand, medische hulp of politie. Beide","nummers verbinden je met de juiste hulpdiensten (ambulance, brandweer, politie) en","kunnen vanuit mobiele telefoons en vaste lijnen worden gebeld.","2. 101 – Non-urgent politie","Dit nummer is voor minder dringende politie-kwesties, zoals het melden van misdaden die","geen onmiddellijke actie vereisen, of voor algemene informatie.","3. 111 – Nationale gezondheidsdienst (NHS)","Dit nummer kan worden gebeld voor niet-dringende medische hulp, advies of om te weten","waar je de juiste zorg kunt krijgen als je geen levensbedreigende situatie hebt.","Deze nummers zijn gratis te bellen en werken 24 uur per dag, 7 dagen per week."]}],"routes":[{"key":"g-Camden","title":"Camden","district":"Camden","guide":true,"stopIds":[0,1,2,3,4,5,6],"stops":[[51.531895,-0.126676],[51.541605,-0.146543],[51.533846,-0.155988],[51.535795,-0.153477],[51.5219,-0.126],[51.51961,-0.126919],[51.523987,-0.116542]],"points":[[51.531885,-0.126669],[51.531842,-0.126822],[51.531801,-0.126972],[51.531769,-0.127195],[51.531759,-0.12725],[51.531752,-0.127285],[51.53185,-0.127347],[51.531934,-0.127402],[51.532196,-0.127578],[51.532336,-0.127679],[51.532429,-0.127747],[51.532614,-0.127891],[51.532733,-0.127985],[51.5329,-0.128116],[51.533314,-0.128426],[51.533404,-0.128498],[51.533409,-0.128502],[51.533429,-0.128541],[51.533487,-0.128592],[51.533563,-0.128668],[51.533599,-0.1287],[51.533666,-0.128778],[51.533675,-0.128765],[51.533687,-0.128739],[51.533869,-0.128986],[51.534211,-0.129449],[51.534265,-0.129522],[51.534318,-0.129613],[51.534399,-0.129796],[51.534802,-0.130724],[51.535028,-0.131265],[51.535082,-0.131394],[51.535109 function stepTour(d) { const t = state.tour; t.i = Math.min(t.route.stops.length - 1, Math.max(0, t.i + d)); const s = t.route.stops[t.i].poi; renderTour(); refresh(); flyToPoi(s, 16); }
